    <div class="fg"><span class="fl">Barva</span><div class="swatches">${CONFIG.accents.map(hx=>`<div class="swatch ${S.ui.accent.toLowerCase()===hx.toLowerCase()?'on':''}" style="background:${hx}" onclick="setAccent('${hx}')"></div>`).join('')}
      <label class="swatch" style="background:conic-gradient(#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00);display:grid;place-items:center;overflow:hidden"><input type="color" value="${S.ui.accent}" oninput="setAccent(this.value)" style="opacity:0;width:100%;height:100%;cursor:pointer"></label></div></div>
    ${S.ui.hideIntro?`<div class="fg"><span class="fl">Průvodce začátkem</span><button class="btn sm" onclick="showIntro()">${ic('rocket',14)} Zobrazit znovu</button></div>`:''}
    <div class="fg"><span class="fl">Font čísel</span><select class="inp" onchange="setNumFont(this.value)">${Object.entries(NUMFONTS).map(([k,f])=>`<option value="${k}" ${S.ui.numFont===k?'selected':''}>${f.label}</option>`).join('')}</select>
      <div class="mini" style="margin-top:8px">Ukázka: <span class="num" style="font-size:20px;color:var(--text)">1&nbsp;234&nbsp;567&nbsp;Kč · 28&nbsp;000 · 15,5&nbsp;%</span></div></div>
    <div class="fg"><span class="fl">Záložky v menu (přejmenuj, skryj, přeřaď)</span><div style="margin-top:2px">`;
  S.ui.tabs.forEach((t,i)=>{const locked=t.id==='nastaveni';h+=`<div class="cfgrow">
    <span style="color:var(--text3)">${ic(t.icon,17)}</span>
    <input class="inp" value="${esc(t.label)}" onchange="renameTab('${t.id}',this.value)" style="flex:1;padding:7px 10px">
    <button class="ib" title="Nahoru" ${i===0?'disabled style=opacity:.3':''} onclick="moveTab('${t.id}',-1)">${ic('up',16)}</button>
    <button class="ib" title="Dolů" ${i===S.ui.tabs.length-1?'disabled style=opacity:.3':''} onclick="moveTab('${t.id}',1)">${ic('down',16)}</button>
    <label class="mini" style="display:flex;align-items:center;gap:5px;cursor:${locked?'default':'pointer'}"><input type="checkbox" ${t.visible?'checked':''} ${locked?'disabled':''} onchange="toggleTab('${t.id}')" style="width:auto"> zobrazit</label>
  </div>`;});
  h+=`</div></div></div>`;

  // periods
  h+=`<div class="card"><div class="ct" style="margin-bottom:14px">${ic('calendar',15)} Výplatní období</div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px">
      <button class="btn fill" onclick="newPeriodModal()">${ic('plus',15)} Nové období</button>
      <button class="btn" onclick="periodEditModal()">Upravit aktuální</button>
      ${S.periods.length>1?`<button class="btn dgr" onclick="delPeriod()">Smazat aktuální</button>`:''}</div>`;
  S.periods.forEach(pp=>{h+=`<div class="row"><div class="ic" style="background:var(--bg2);color:var(--text3)">${ic('calendar',18)}</div><div class="m"><div class="t1">${esc(pp.nm)} ${pp.id===S.curId?'<span class="tag ok" style="margin-left:6px">aktuální</span>':''}</div><div class="t2">${fdFull(pp.from)} → ${fdFull(pp.to)}</div></div><div class="amt">${fm(sumActual(pp))}</div></div>`;});
  h+=`</div>`;

  // finance settings
  h+=`<div class="card"><div class="ct" style="margin-bottom:14px">${ic('percent',15)} Daň z úroků</div>
    <div style="max-width:200px"><div class="fg"><span class="fl">Sazba %</span><input class="inp num" type="number" value="${S.tax}" onchange="S.tax=+this.value;commit()"></div></div>
    <p class="mini" style="margin-top:10px">Strhává se z úroku připsaného u spořáků a investic (v ČR běžně 15 %).</p></div>`;

  h+=`<div class="card"><div class="ct" style="margin-bottom:10px;color:var(--neg)">Nebezpečná zóna</div><p class="mini" style="margin:0 0 12px">Smaže všechna data. Jde vrátit jen ze zálohy.</p><button class="btn dgr" onclick="resetAll()">${ic('trash',15)} Smazat všechna data</button></div>`;
  h+=`<div class="banner tip"><span class="bi">${ic('rocket',18)}</span><div><b>Mobil a synchronizace</b> jsou další krok — až budeš chtít appku i do telefonu se stejnými daty, řekni.</div></div>`;
  return h;
}

/* =====================================================================
   ACTIONS
   ===================================================================== */
function switchPeriod(d){const i=periodIndex()+d;if(i<0||i>=S.periods.length)return;S.curId=S.periods[i].id;detailCat=null;openItem=null;commit();}
// pozor: nesmí volat go() — to by detailCat hned vynulovalo
function openCat(id){tab='vydaje';detailCat=id;openItem=null;R();window.scrollTo(0,0);}
function closeCat(){detailCat=null;openItem=null;R();}
function toggleItem(id){openItem=openItem===id?null:id;R();}

function quickAdd(){const p=P();const val=document.getElementById('qcat').value;const amt=Math.abs(num(document.getElementById('qamt').value));if(!amt){toast('Zadej částku');return;}
  const nm=document.getElementById('qname').value.trim();const date=document.getElementById('qdate').value||todayISO();
  qaSel=val;qaDate=date; // zapamatuj výběr pro další rychlé zadání
  if(val.startsWith('env:')){const e=S.envelopes.find(x=>x.id===val.slice(4));if(!e)return;e.bal=(e.bal||0)+amt;e.hist.push({d:date,t:'in',a:amt,n:nm||'',pid:S.curId});toast(`Odloženo ${fm(amt)} → ${e.nm}`);}
  else{const cid=val.startsWith('cat:')?val.slice(4):val;const c=p.cats.find(x=>x.id===cid);if(!c)return;
    const itNm=nm||'Ostatní';let it=c.it.find(x=>x.nm.toLowerCase()===itNm.toLowerCase());if(!it){it={id:uid(),nm:itNm,pl:0,log:[]};c.it.push(it);}
    const le={id:uid(),d:date,a:amt,n:''};it.log.push(le);pushLinked(it,le);
    const lt=linkTarget(it);toast(`${c.nm}: ${fm(amt)}`+(lt?` → ${lt.obj.nm}`:''));}
  commit();setTimeout(()=>{const a=document.getElementById('qamt');if(a)a.focus();},60);}
function quickModal(){go('prehled');setTimeout(()=>document.getElementById('qamt')?.focus(),60);}

function addLog(cid,iid){const it=P().cats.find(c=>c.id===cid)?.it.find(x=>x.id===iid);if(!it)return;const a=Math.abs(num(document.getElementById('la-'+iid).value));if(!a){toast('Zadej částku');return;}
  const le={id:uid(),d:document.getElementById('ld-'+iid).value||todayISO(),a,n:document.getElementById('ln-'+iid).value.trim()};
  it.log.push(le);pushLinked(it,le);openItem=iid;
  const lt=linkTarget(it);toast(`${it.nm}: +${fm(a)}`+(lt?` → ${lt.obj.nm}`:''));commit();}
function delLog(cid,iid,li){const it=P().cats.find(c=>c.id===cid)?.it.find(x=>x.id===iid);if(!it)return;const le=it.log[li];if(le&&le.id)removeLinked(le.id);it.log.splice(li,1);openItem=iid;commit();}
function setItemPlan(cid,iid,v){const it=P().cats.find(c=>c.id===cid)?.it.find(x=>x.id===iid);if(it){it.pl=num(v);openItem=iid;commit();}}
function addItem(cid){const c=P().cats.find(x=>x.id===cid);if(!c)return;const nm=document.getElementById('nit-'+cid).value.trim();if(!nm){toast('Zadej název');return;}c.it.push({id:uid(),nm,pl:num(document.getElementById('nitp-'+cid).value),log:[]});commit();}
function delItem(cid,iid){if(!confirm('Smazat položku?'))return;const c=P().cats.find(x=>x.id===cid);const it=c.it.find(x=>x.id===iid);if(it)(it.log||[]).forEach(le=>removeLinked(le.id));c.it=c.it.filter(x=>x.id!==iid);openItem=null;commit();}
function setItemLink(cid,iid,v){const it=P().cats.find(c=>c.id===cid)?.it.find(x=>x.id===iid);if(!it)return;it.link=v||'';openItem=iid;toast(v?('Propojeno — '+linkLabel(it)):'Propojení zrušeno');commit();}
function setItemKind(cid,iid,v){const it=P().cats.find(c=>c.id===cid)?.it.find(x=>x.id===iid);if(!it)return;if(v)it.kind=v;else delete it.kind;openItem=iid;commit();}
function setCatPlan(cid,v){const c=P().cats.find(x=>x.id===cid);if(c){c.pl=num(v);commit();}}
function renameItem(cid,iid,v){const it=P().cats.find(c=>c.id===cid)?.it.find(x=>x.id===iid);const nm=(v||'').trim();if(!it)return;if(!nm){toast('Název nesmí být prázdný');R();return;}it.nm=nm;openItem=iid;commit();}
function toggleFixed(cid,iid){const it=P().cats.find(c=>c.id===cid)?.it.find(x=>x.id===iid);if(it){it.fixed=!it.fixed;openItem=iid;commit();}}
function payRecurring(){const p=P();let cnt=0,tot=0;p.cats.forEach(c=>c.it.forEach(it=>{if(!it.fixed||!(it.pl>0))return;const paid=(it.log||[]).some(e=>e.d>=p.from&&e.d<p.to&&e.n==='(pravidelné)');if(paid)return;const le={id:uid(),d:todayISO(),a:it.pl,n:'(pravidelné)'};(it.log||(it.log=[])).push(le);pushLinked(it,le);cnt++;tot+=it.pl;}));if(!cnt){toast('Pravidelné už zaplaceny nebo žádné nenastaveny');return;}toast(`Zaplaceno ${cnt} pravidelných · ${fm(tot)}`);commit();}

/* modal infra */
function openModal(html){const ov=document.createElement('div');ov.className='ov';ov.id='ov';ov.innerHTML=`<div class="modal">${html}</div>`;ov.onclick=e=>{if(e.target===ov)closeModal();};document.body.appendChild(ov);}
function closeModal(){document.getElementById('ov')?.remove();}
function iconPicker(list,cur){return `<div class="iconpick" id="m_ic">${list.map(n=>`<button class="${cur===n?'on':''}" data-ic="${n}" onclick="mctx.icon='${n}';document.querySelectorAll('#m_ic button').forEach(b=>b.classList.toggle('on',b.dataset.ic==='${n}'))">${ic(n,20)}</button>`).join('')}</div>`;}

/* category */
function catModal(id){const c=id?P().cats.find(x=>x.id===id):null;mctx={id,icon:c?c.icon:'cart',kind:c?(c.kind||'need'):'need'};
  openModal(`<h3>${c?'Upravit':'Nová'} kategorie</h3>
    <div class="fg"><span class="fl">Název</span><input class="inp" id="m_nm" value="${c?esc(c.nm):''}" placeholder="např. Zábava"></div>
    <div class="fg"><span class="fl">Ikona</span>${iconPicker(CAT_ICONS,mctx.icon)}</div>
    <div class="fg"><span class="fl">Výchozí typ položek (50/30/20)</span><div class="seg" id="m_kind" style="font-size:12px">
      ${[['need','Potřeba','50 %'],['want','Přání','30 %'],['save','Úspora','20 %']].map(([k,l,pc])=>
        `<button class="${(mctx.kind||'need')===k?'on':''}" data-k="${k}" onclick="mctx.kind='${k}';document.querySelectorAll('#m_kind button').forEach(b=>b.classList.toggle('on',b.dataset.k==='${k}'))">${l}<br><span style="opacity:.7;font-weight:400">${pc}</span></button>`).join('')}</div>
      <div class="mini" style="margin-top:6px">Potřeba = nájem, jídlo, doprava… Přání = zábava, věci navíc… Úspora = splátky, odkládání, investice (peníze, které ti zůstávají).<br>Platí pro všechny položky kategorie — u jednotlivé položky to jde nastavit jinak.</div></div>
    <div class="macts"><button class="btn gho" onclick="closeModal()">Zrušit</button><button class="btn fill" onclick="saveCat()">${c?'Uložit':'Vytvořit'}</button></div>`);}
function saveCat(){const nm=document.getElementById('m_nm').value.trim();if(!nm){toast('Zadej název');return;}const p=P();if(mctx.id){const c=p.cats.find(x=>x.id===mctx.id);c.nm=nm;c.icon=mctx.icon;c.kind=mctx.kind;}else p.cats.push({id:uid(),nm,icon:mctx.icon,kind:mctx.kind,it:[]});closeModal();commit();}
function delCat(id){if(!confirm('Smazat celou kategorii i s položkami?'))return;const p=P();p.cats=p.cats.filter(x=>x.id!==id);detailCat=null;closeModal();commit();}

/* měsíční plány kategorií — vše na jedné obrazovce */
function plansModal(){const p=P();
  openModal(`<h3>Měsíční plány</h3><div class="md">Kolik chceš v každé kategorii utratit za jeden výplatní cyklus. Nech 0 tam, kde plán nechceš.</div>
    <div id="plrows">${p.cats.map(c=>`<div style="display:flex;align-items:center;gap:10px;margin-top:10px">
      <span style="color:var(--text3)">${ic(c.icon,17)}</span>
      <span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px">${esc(c.nm)}</span>
      <input class="inp num" type="number" data-cid="${c.id}" value="${catPlan(c)||''}" placeholder="0" style="flex:0 0 110px;text-align:right"></div>`).join('')}</div>
    <div style="display:flex;justify-content:space-between;margin-top:14px;padding-top:12px;border-top:1.5px solid var(--line);font-size:14px;font-weight:600">
      <span>Celkem za cyklus</span><span class="num" id="pltot">${fm(sumPlan(p))}</span></div>
    <div class="macts"><button class="btn gho" onclick="closeModal()">Zrušit</button><button class="btn fill" onclick="savePlans()">Uložit plány</button></div>`);
  const upd=()=>{let s=0;document.querySelectorAll('#plrows [data-cid]').forEach(i=>s+=num(i.value));document.getElementById('pltot').textContent=fm(s);};
  document.querySelectorAll('#plrows [data-cid]').forEach(i=>{i.oninput=upd;i.onkeydown=e=>{if(e.key==='Enter')savePlans();};});
  setTimeout(()=>document.querySelector('#plrows [data-cid]')?.focus(),50);}
function savePlans(){const p=P();document.querySelectorAll('#plrows [data-cid]').forEach(i=>{const c=p.cats.find(x=>x.id===i.dataset.cid);if(c)c.pl=num(i.value);});closeModal();toast('Plány uloženy');commit();}

/* income */
function incomeModal(){const p=P();openModal(`<h3>Příjmy období</h3><div class="md">Skutečně = kolik reálně přišlo (podle toho počítám „zbývá volných").</div>
    <div id="incrows">${p.income.map((r,i)=>incRow(r,i)).join('')}</div>
    <button class="btn sm" style="margin-top:8px" onclick="addIncRow()">${ic('plus',14)} Přidat řádek</button>
    <div class="macts"><button class="btn gho" onclick="closeModal()">Zrušit</button><button class="btn fill" onclick="saveIncome()">Uložit</button></div>`);}
function incRow(r,i){return `<div class="fr" style="align-items:flex-end;margin-top:10px" data-ir="${i}"><div style="flex:1.4"><span class="fl">Název</span><input class="inp" value="${esc(r.label)}" data-f="label"></div><div><span class="fl">Plán</span><input class="inp num" type="number" value="${r.pl||0}" data-f="pl"></div><div><span class="fl">Skutečně</span><input class="inp num" type="number" value="${r.ac||0}" data-f="ac"></div></div>`;}
function addIncRow(){const wrap=document.getElementById('incrows');const d=document.createElement('div');d.innerHTML=incRow({label:'',pl:0,ac:0},wrap.children.length);wrap.appendChild(d.firstChild);}
function saveIncome(){const p=P();const rows=[...document.querySelectorAll('#incrows [data-ir]')];p.income=rows.map(r=>({label:r.querySelector('[data-f=label]').value.trim()||'Příjem',pl:num(r.querySelector('[data-f=pl]').value),ac:num(r.querySelector('[data-f=ac]').value)})).filter(r=>r.label||r.pl||r.ac);if(!p.income.length)p.income=[{label:'Výplata',pl:0,ac:0}];closeModal();commit();}

/* envelopes */
function envModal(id){const e=id?S.envelopes.find(x=>x.id===id):null;mctx={id,icon:e?e.icon:'target'};
  openModal(`<h3>${e?'Upravit':'Nová'} obálka</h3>
    <div class="fg"><span class="fl">Název</span><input class="inp" id="m_nm" value="${e?esc(e.nm):''}" placeholder="např. Dovolená"></div>
    <div class="fg"><span class="fl">Ikona</span>${iconPicker(ENV_ICONS,mctx.icon)}</div>
    <div class="fr"><div class="fg"><span class="fl">Měsíčně odkládat</span><input class="inp num" id="m_mo" type="number" value="${e?e.monthly||0:''}" placeholder="0"></div><div class="fg"><span class="fl">Cíl (nepovinné)</span><input class="inp num" id="m_tg" type="number" value="${e?e.target||0:''}" placeholder="0"></div></div>
    <div class="fg"><span class="fl">Cíl splnit do (nepovinné)</span><input class="inp" id="m_due" type="date" value="${e?e.due||'':''}"></div>
    ${!e?`<div class="fg"><span class="fl">Počáteční zůstatek</span><input class="inp num" id="m_bal" type="number" placeholder="0"></div>`:''}
    <div class="macts"><button class="btn gho" onclick="closeModal()">Zrušit</button><button class="btn fill" onclick="saveEnv()">${e?'Uložit':'Vytvořit'}</button></div>`);}
function saveEnv(){const nm=document.getElementById('m_nm').value.trim();if(!nm){toast('Zadej název');return;}const mo=num(document.getElementById('m_mo').value),tg=num(document.getElementById('m_tg').value),due=document.getElementById('m_due').value;
  if(mctx.id){const e=S.envelopes.find(x=>x.id===mctx.id);e.nm=nm;e.icon=mctx.icon;e.monthly=mo;e.target=tg;e.due=due;}
  else{const bal=num(document.getElementById('m_bal').value);const e={id:uid(),nm,icon:mctx.icon,bal:0,monthly:mo,target:tg,due,hist:[]};if(bal){e.bal=bal;e.hist.push({d:todayISO(),t:'in',a:bal,n:'Počáteční',pid:S.curId});}S.envelopes.push(e);}closeModal();commit();}
function delEnv(id){const e=S.envelopes.find(x=>x.id===id);if(e.bal>0&&!confirm(`V obálce je ${fm(e.bal)}. Opravdu smazat?`))return;if(e.bal<=0&&!confirm('Smazat obálku?'))return;S.envelopes=S.envelopes.filter(x=>x.id!==id);commit();}
function envMove(id,dir){const e=S.envelopes.find(x=>x.id===id);mctx={id,dir};openModal(`<h3>${dir==='in'?'Vložit do':'Čerpat z'}: ${esc(e.nm)}</h3><div class="md">Zůstatek: <b>${fm(e.bal||0)}</b>${dir==='in'?' · vklad se započítá jako „odloženo" tento cyklus.':' · ubyde z obálky (do výplaty se už nepočítá).'}</div>
    <div class="fg"><span class="fl">Částka</span><input class="inp num" id="m_a" type="number" placeholder="0" onkeydown="if(event.key==='Enter')doEnvMove()"></div>
    <div class="fg"><span class="fl">Poznámka</span><input class="inp" id="m_n" placeholder="${dir==='in'?'nepovinné':'např. Letenky'}" onkeydown="if(event.key==='Enter')doEnvMove()"></div>
    ${dir==='out'?`<div class="fg"><span class="fl">Zařadit do kategorie (nepovinné, pro statistiky)</span><select class="inp" id="m_cat"><option value="">— nezařazovat —</option>${P().cats.map(c=>`<option value="${esc(c.nm)}">${esc(c.nm)}</option>`).join('')}</select></div>`:''}
    <div class="macts"><button class="btn gho" onclick="closeModal()">Zrušit</button><button class="btn fill" onclick="doEnvMove()">${dir==='in'?'Vložit':'Čerpat'}</button></div>`);
  setTimeout(()=>document.getElementById('m_a')?.focus(),50);}
function doEnvMove(){const e=S.envelopes.find(x=>x.id===mctx.id);const a=Math.abs(num(document.getElementById('m_a').value));if(!a){toast('Zadej částku');return;}const n=document.getElementById('m_n').value.trim();
  if(mctx.dir==='out'&&a>(e.bal||0)){toast('V obálce není dost peněz');return;}
  const entry={d:todayISO(),t:mctx.dir,a,n,pid:S.curId};
  if(mctx.dir==='out'){const cat=document.getElementById('m_cat')?.value;if(cat)entry.cat=cat;}
  e.bal=(e.bal||0)+(mctx.dir==='in'?a:-a);e.hist.push(entry);closeModal();toast(`${mctx.dir==='in'?'+':'−'}${fm(a)} · ${e.nm}`);commit();}

function depositMonthlyAll(){const cur=S.curId;let cnt=0,tot=0;S.envelopes.forEach(e=>{if(!e.monthly||e.monthly<=0)return;if((e.hist||[]).some(h=>h.pid===cur&&h.n==='Měsíční odklad'))return;e.bal=(e.bal||0)+e.monthly;e.hist.push({d:todayISO(),t:'in',a:e.monthly,n:'Měsíční odklad',pid:cur});cnt++;tot+=e.monthly;});if(!cnt){toast('Měsíční částky už odloženy nebo nenastaveny');return;}toast(`Odloženo ${fm(tot)} do ${cnt} obálek`);commit();}
/* investments */
function invModal(id){const inv=id?S.investments.find(x=>x.id===id):null;mctx={id,icon:inv?inv.icon:'trending'};
  openModal(`<h3>${inv?'Upravit':'Nová'} investice / úspora</h3>
    <div class="fg"><span class="fl">Název</span><input class="inp" id="m_nm" value="${inv?esc(inv.nm):''}" placeholder="např. ETF, Bitcoin, Spořák"></div>
    <div class="fg"><span class="fl">Ikona</span>${iconPicker(INV_ICONS,mctx.icon)}</div>
    <div class="fr"><div class="fg"><span class="fl">Aktuální hodnota</span><input class="inp num" id="m_val" type="number" value="${inv?inv.val||0:''}" placeholder="0"></div>
      <div class="fg"><span class="fl">Úrok % p.a. (0 = žádný)</span><input class="inp num" id="m_rate" type="number" step="0.01" value="${inv?inv.rate||0:''}" placeholder="0"></div></div>
    <p class="mini" style="margin-top:8px">Úrok se připisuje k 1. dni v měsíci, po dani ${S.tax} %.</p>
    ${inv?`<div style="text-align:right;margin-top:8px"><button class="btn dgr sm" onclick="delInv('${inv.id}')">Smazat</button></div>`:''}
    <div class="macts"><button class="btn gho" onclick="closeModal()">Zrušit</button><button class="btn fill" onclick="saveInv()">${inv?'Uložit':'Vytvořit'}</button></div>`);}
function saveInv(){const nm=document.getElementById('m_nm').value.trim();if(!nm){toast('Zadej název');return;}const val=num(document.getElementById('m_val').value),rate=num(document.getElementById('m_rate').value);
  if(mctx.id){const inv=S.investments.find(x=>x.id===mctx.id);inv.nm=nm;inv.icon=mctx.icon;inv.val=val;inv.rate=rate;if(rate>0&&!inv.lastInt)inv.lastInt=iso(firstOfMonth(new Date()));}
  else{const inv={id:uid(),nm,icon:mctx.icon,val,rate,lastInt:rate>0?iso(firstOfMonth(new Date())):null,hist:[]};S.investments.push(inv);}closeModal();commit();}
function delInv(id){if(!confirm('Smazat?'))return;S.investments=S.investments.filter(x=>x.id!==id);closeModal();commit();}
function invAdd(id){const inv=S.investments.find(x=>x.id===id);mctx={id};openModal(`<h3>Přidat částku: ${esc(inv.nm)}</h3><div class="md">Hodnota: <b>${fm(inv.val||0)}</b> · záporná částka = odečtení.</div>
    <div class="fg"><span class="fl">Částka</span><input class="inp num" id="m_a" type="number" placeholder="0" onkeydown="if(event.key==='Enter')doInvAdd()"></div>
    <div class="fg"><span class="fl">Poznámka</span><input class="inp" id="m_n" placeholder="nepovinné" onkeydown="if(event.key==='Enter')doInvAdd()"></div>
    <div class="macts"><button class="btn gho" onclick="closeModal()">Zrušit</button><button class="btn fill" onclick="doInvAdd()">Přidat</button></div>`);
  setTimeout(()=>document.getElementById('m_a')?.focus(),50);}
function doInvAdd(){const inv=S.investments.find(x=>x.id===mctx.id);const a=num(document.getElementById('m_a').value);if(!a){toast('Zadej částku');return;}inv.val=(inv.val||0)+a;inv.hist.push({d:todayISO(),a,n:document.getElementById('m_n').value.trim(),pid:S.curId});closeModal();toast(`${a>0?'+':''}${fm(a)} · ${inv.nm}`);commit();}

/* debts */
function debtModal(id){const d=id?S.debts.find(x=>x.id===id):null;mctx={id,icon:d?d.icon:'landmark'};
  openModal(`<h3>${d?'Upravit':'Nový'} dluh</h3>
    <div class="fg"><span class="fl">Název</span><input class="inp" id="m_nm" value="${d?esc(d.nm):''}" placeholder="např. Půjčka od rodičů"></div>
    <div class="fg"><span class="fl">Typ (štítek, nepovinné)</span><input class="inp" id="m_ty" value="${d?esc(d.type||''):''}" placeholder="např. Půjčka, Hypotéka"></div>
    <div class="fg"><span class="fl">Ikona</span>${iconPicker(DEBT_ICONS,mctx.icon)}</div>
    <div class="fr"><div class="fg"><span class="fl">Celková částka (jistina)</span><input class="inp num" id="m_pr" type="number" value="${d?d.principal||0:''}" placeholder="0"></div>
      <div class="fg"><span class="fl">Úrok % p.a. (0 = bez)</span><input class="inp num" id="m_rate" type="number" step="0.01" value="${d?d.rate||0:''}" placeholder="0"></div></div>
    <div class="fr"><div class="fg"><span class="fl">Už splaceno (bez data)</span><input class="inp num" id="m_p0" type="number" value="${d?d.paid0||0:''}" placeholder="0"></div>
      <div class="fg"><span class="fl">Měsíční splátka</span><input class="inp num" id="m_dm" type="number" value="${d?d.monthly||0:''}" placeholder="0"></div></div>
    <p class="mini" style="margin-top:6px">Měsíční splátka → spočítám, kdy dluh doplatíš a kolik zaplatíš na úrocích.</p>
    <div class="macts"><button class="btn gho" onclick="closeModal()">Zrušit</button><button class="btn fill" onclick="saveDebt()">${d?'Uložit':'Vytvořit'}</button></div>`);}
function saveDebt(){const nm=document.getElementById('m_nm').value.trim();if(!nm){toast('Zadej název');return;}const pr=num(document.getElementById('m_pr').value),rate=num(document.getElementById('m_rate').value),p0=num(document.getElementById('m_p0').value),ty=document.getElementById('m_ty').value.trim();
  const dm=num(document.getElementById('m_dm').value);
  if(mctx.id){const d=S.debts.find(x=>x.id===mctx.id);d.nm=nm;d.icon=mctx.icon;d.principal=pr;d.rate=rate;d.type=ty;d.paid0=p0;d.monthly=dm;}else S.debts.push({id:uid(),nm,icon:mctx.icon,type:ty,principal:pr,rate,paid0:p0,monthly:dm,pay:[]});closeModal();commit();}
function delDebt(id){if(!confirm('Smazat dluh i s platbami?'))return;S.debts=S.debts.filter(x=>x.id!==id);commit();}
function debtPayModal(id){const d=S.debts.find(x=>x.id===id);mctx={id};openModal(`<h3>Splátka: ${esc(d.nm)}</h3><div class="md">Zbývá splatit: <b>${fm(debtRemaining(d))}</b>${d.rate>0?` · úrok ${(''+d.rate).replace('.',',')} % p.a.`:''}</div>
    <div class="fg"><span class="fl">Částka</span><input class="inp num" id="m_a" type="number" placeholder="0" onkeydown="if(event.key==='Enter')doDebtPay()"></div>
    <div class="fr"><div class="fg"><span class="fl">Datum</span><input class="inp" id="m_d" type="date" value="${todayISO()}"></div><div class="fg"><span class="fl">Poznámka</span><input class="inp" id="m_n" placeholder="nepovinné" onkeydown="if(event.key==='Enter')doDebtPay()"></div></div>
    <div class="macts"><button class="btn gho" onclick="closeModal()">Zrušit</button><button class="btn fill" onclick="doDebtPay()">Zaplatit</button></div>`);
  setTimeout(()=>document.getElementById('m_a')?.focus(),50);}
function doDebtPay(){const d=S.debts.find(x=>x.id===mctx.id);const a=Math.abs(num(document.getElementById('m_a').value));if(!a){toast('Zadej částku');return;}d.pay.push({d:document.getElementById('m_d').value||todayISO(),a,n:document.getElementById('m_n').value.trim()});closeModal();toast(`Splátka ${fm(a)} · ${d.nm}`);commit();}
function delDebtPay(id,i){const d=S.debts.find(x=>x.id===id);d.pay.splice(i,1);commit();}

/* customization actions */
function hideIntro(){S.ui.hideIntro=true;toast('Skryto — vrátíš v Nastavení');commit();}
function showIntro(){S.ui.hideIntro=false;go('prehled');}
function setAccent(hex){S.ui.accent=hex;applyAccent(hex);commit();}
function renameTab(id,v){const t=S.ui.tabs.find(x=>x.id===id);if(t){t.label=v.trim()||t.label;persist();}}
function toggleTab(id){const t=S.ui.tabs.find(x=>x.id===id);if(t&&t.id!=='nastaveni'){t.visible=!t.visible;commit();}}
function moveTab(id,dir){const i=S.ui.tabs.findIndex(x=>x.id===id);const j=i+dir;if(j<0||j>=S.ui.tabs.length)return;const t=S.ui.tabs.splice(i,1)[0];S.ui.tabs.splice(j,0,t);commit();}

/* periods */
function newPeriodModal(){const last=S.periods[S.periods.length-1];const from=last?last.to:todayISO();const fd2=new Date(from);const to=iso(new Date(fd2.getFullYear(),fd2.getMonth()+1,fd2.getDate()));
  openModal(`<h3>Nové výplatní období</h3><div class="md">Zadej skutečná data — od dne, kdy přišla výplata, do příští výplaty. Klidně pokaždé jiná.</div>
    <div class="fg"><span class="fl">Název</span><input class="inp" id="m_nm" value="Výplata ${monthName(from)}"></div>
    <div class="fr"><div class="fg"><span class="fl">Od výplaty</span><input class="inp" id="m_f" type="date" value="${from}"></div><div class="fg"><span class="fl">Příští výplata</span><input class="inp" id="m_t" type="date" value="${to}"></div></div>
    <label class="fg" style="display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer"><input type="checkbox" id="m_copy" checked style="width:auto"> Zkopírovat plán výdajů z aktuálního</label>
    <div class="macts"><button class="btn gho" onclick="closeModal()">Zrušit</button><button class="btn fill" onclick="createPeriod()">Vytvořit</button></div>`);}
function createPeriod(){const nm=document.getElementById('m_nm').value.trim()||'Nové období';const f=document.getElementById('m_f').value,t=document.getElementById('m_t').value;if(!f||!t){toast('Vyplň data');return;}
  let np;if(document.getElementById('m_copy').checked){np=JSON.parse(JSON.stringify(P()));np.id=uid();np.nm=nm;np.from=f;np.to=t;np.income.forEach(r=>r.ac=0);np.cats.forEach(c=>{c.id=uid();c.it.forEach(it=>{it.id=uid();it.log=[];});});}else np=defPeriod(nm,f,t);
  S.periods.push(np);S.curId=np.id;detailCat=null;closeModal();toast('Období vytvořeno');commit();}
function periodEditModal(){const p=P();openModal(`<h3>Upravit období</h3>
    <div class="fg"><span class="fl">Název</span><input class="inp" id="m_nm" value="${esc(p.nm)}"></div>
    <div class="fr"><div class="fg"><span class="fl">Od výplaty</span><input class="inp" id="m_f" type="date" value="${p.from}"></div><div class="fg"><span class="fl">Příští výplata</span><input class="inp" id="m_t" type="date" value="${p.to}"></div></div>
    <div class="macts"><button class="btn gho" onclick="closeModal()">Zrušit</button><button class="btn fill" onclick="savePeriod()">Uložit</button></div>`);}
function savePeriod(){const p=P();p.nm=document.getElementById('m_nm').value.trim()||p.nm;p.from=document.getElementById('m_f').value||p.from;p.to=document.getElementById('m_t').value||p.to;closeModal();commit();}
function delPeriod(){if(S.periods.length<=1){toast('Musí zůstat aspoň jedno období');return;}if(!confirm('Smazat aktuální období?'))return;const i=periodIndex();S.periods.splice(i,1);S.curId=S.periods[Math.max(0,i-1)].id;detailCat=null;commit();}

/* data */
function exportData(){S.lastExport=todayISO();saveLS();const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='rozpocet-zaloha-'+todayISO()+'.json';a.click();URL.revokeObjectURL(url);toast('Záloha stažena');R();}
function exportCSV(){const rows=[['Období','Kategorie','Položka','Datum','Poznámka','Částka']];
  S.periods.forEach(p=>p.cats.forEach(c=>c.it.forEach(it=>(it.log||[]).forEach(l=>rows.push([p.nm,c.nm,it.nm,l.d||'',l.n||'',l.a])))));
  S.envelopes.forEach(e=>(e.hist||[]).forEach(x=>{const p=S.periods.find(q=>q.id===x.pid);rows.push([p?p.nm:'','Obálka: '+e.nm,x.t==='in'?'vklad':'čerpání',x.d||'',x.n||'',x.t==='in'?x.a:-x.a]);}));
  S.debts.forEach(d=>(d.pay||[]).forEach(x=>{rows.push(['','Dluh: '+d.nm,'splátka',x.d||'',x.n||'',x.a]);}));
  const csv='﻿'+rows.map(r=>r.map(v=>'"'+(''+v).replace(/"/g,'""')+'"').join(';')).join('\r\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='rozpocet-'+todayISO()+'.csv';a.click();URL.revokeObjectURL(url);toast('CSV pro Excel staženo');}
function importFile(ev){const f=ev.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.periods||!Array.isArray(d.periods)){toast('Neplatný soubor');return;}if(confirm('Nahradit aktuální data daty ze zálohy?')){S=migrate(d);applyTheme();saveLS();autosaveFile();tab='prehled';detailCat=null;toast('Obnoveno');R();}}catch(e){toast('Nepodařilo se načíst');}ev.target.value='';};r.readAsText(f);}
function resetAll(){if(confirm('Smazat VŠECHNA data a začít od nuly?')&&confirm('Fakt? Jde vrátit jen ze zálohy.')){S=defState();applyTheme();saveLS();autosaveFile();tab='prehled';detailCat=null;R();}}

document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});

/* ---------- boot ---------- */
(async function boot(){
  const ls=loadLS();if(ls)S=ls;
  loadAuth();
  const cameFromMail=readAuthHash();   // návrat z přihlašovacího odkazu
  applyTheme();creditInterest();R();
  await tryReconnectFile();
  applyTheme();creditInterest();R();
  if(cloudOn()&&loggedIn()){
    if(cameFromMail){tab='nastaveni';toast('Přihlášeno');}
    await syncNow(!cameFromMail);
    // po návratu k appce si ověř, jestli mezitím nepřišla novější data
    window.addEventListener('focus',()=>{if(cloudOn()&&loggedIn()&&syncState!=='syncing')syncNow(true);});
  }
})();
</script>
</body>
</html>
