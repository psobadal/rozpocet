/* Paleta: akcent je jen chrom appky (tlačítka, aktivní záložka, odkazy),
   barvy čísel nesou význam a nesmí s ním splývat — zelená příjem, červená
   výdaj, zlatá obálky, tyrkysová investice, modrošedá dluhy. Proto se
   investice přebarvily z fialové: akcent je dnes fialový sám. */
:root{
  --bg:#f7f6f3; --bg2:#efedf1; --white:#ffffff; --card:#ffffff;
  --text:#16151a; --text2:#4f4d58; --text3:#8b8994; --text4:#b0aeb8;
  --line:#eeecf0; --line2:#e1dfe6;
  --accent:#7a5a8c; --accent-d:#674a78; --accent-l:#a98cba; --accent-bg:#f3eef6; --accent-bg2:#e0d3e7;
  --teal:#0f7351; --teal-bg:#e6f4ee;
  --cyan:#2b8fa8; --cyan-bg:#e6f2f6;
  --gold:#b07d1f; --gold-bg:#f9f1de;
  --blue:#5a7fa0; --blue-bg:#eaeff4;
  --neg:#c0453a; --neg-bg:#fbe9e7;
  --numfont:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  --r:18px; --rs:12px;
  --sh:0 1px 2px rgba(22,21,26,.03),0 2px 8px rgba(22,21,26,.04);
  --sh-lg:0 12px 40px rgba(22,21,26,.14);
}
*{margin:0;padding:0;box-sizing:border-box}
b,strong,h1,h2,h3{font-weight:500}
html,body{background:var(--bg)}
body{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;color:var(--text);
  min-height:100vh;-webkit-font-smoothing:antialiased;font-size:15px;line-height:1.45}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.01em;font-weight:500;font-family:var(--numfont)}
input,select,textarea,button{font-family:inherit}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:var(--line2);border-radius:3px}
a{color:var(--accent-d);cursor:pointer}
svg.i{display:inline-block;vertical-align:-2.5px;flex:none}

.app{max-width:764px;margin:0 auto;padding:0 20px 110px;position:relative;z-index:1}

.top{display:flex;align-items:center;gap:12px;padding:22px 0 14px}
.brand{font-size:21px;font-weight:500;letter-spacing:-.4px;display:flex;align-items:center;gap:9px}
.brand .mk{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--accent-d),var(--accent-l));display:grid;place-items:center;color:#fff}
.sp{flex:1}
.save-pill{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:500;padding:7px 12px;border-radius:20px;border:1.5px solid var(--line2);background:var(--white);cursor:pointer;white-space:nowrap}
.save-pill .d{width:8px;height:8px;border-radius:50%}
.save-pill.ok{border-color:var(--teal-bg);color:var(--teal)} .save-pill.ok .d{background:var(--teal)}
.save-pill.warn{border-color:var(--accent-bg2);color:var(--accent-d)} .save-pill.warn .d{background:var(--accent);animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

.period{background:var(--white);border:1px solid var(--line);border-radius:var(--r);padding:14px 18px;margin-bottom:14px;display:flex;align-items:center;gap:12px}
.period .nav{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--line2);background:var(--bg);cursor:pointer;color:var(--text2);display:grid;place-items:center;flex:none}
.period .nav:hover{border-color:var(--accent);color:var(--accent)}
.period .nav[disabled]{opacity:.3;cursor:default}
.period .mid{flex:1;text-align:center;min-width:0}
.period .pn{font-size:16px;font-weight:500}
.period .pd{font-size:12px;color:var(--text3);margin-top:1px}
.period .edit{background:none;border:none;color:var(--text3);cursor:pointer;padding:6px;border-radius:8px;display:grid;place-items:center}
.period .edit:hover{background:var(--bg);color:var(--text)}

.tabs{display:flex;gap:3px;background:var(--white);border:1px solid var(--line);border-radius:99px;padding:4px;margin-bottom:18px;overflow-x:auto;scrollbar-width:none;position:sticky;top:10px;z-index:40}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1;min-width:max-content;background:none;border:none;color:var(--text2);padding:9px 8px;cursor:pointer;font-size:12.8px;font-weight:500;border-radius:99px;white-space:nowrap;transition:.15s;display:inline-flex;align-items:center;justify-content:center;gap:6px;line-height:1}
.tab:hover{color:var(--text2)}
.tab.on{background:var(--accent);color:#fff}

.seg{display:flex;gap:4px;background:var(--white);border-radius:99px;padding:4px;border:1px solid var(--line)}
.seg button{flex:1;background:none;border:none;color:var(--text3);padding:9px 12px;cursor:pointer;font-size:13px;font-weight:500;border-radius:99px;transition:.15s}
.seg button:hover{color:var(--text2)}
.seg button.on{background:var(--accent);color:#fff}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px;margin-bottom:14px}
.ch{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:10px}
.ct{font-size:13px;font-weight:500;color:var(--text2);display:flex;align-items:center;gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:640px){.grid3{grid-template-columns:1fr}.grid2{grid-template-columns:1fr}}

/* Hlavní číslo nesedí v orámované kartě na střed jako dřív, ale volně
   vlevo, jak je zvykem v bankovních appkách — oko ho najde dřív a zbyde
   místo na řadu akcí pod ním. */
.hero>*{position:relative}
/* Hlavní číslo nesedí v orámované kartě na střed jako dřív, ale volně
   vlevo, jak je zvykem v bankovních appkách — oko ho najde dřív a zbyde
   místo na řadu akcí pod ním. */
.hero{border-radius:22px;padding:8px 4px 2px;margin-bottom:14px;text-align:center;position:relative}
.hero>*{position:relative}
.hero .lbl{font-size:12.5px;color:var(--text3);font-weight:500;margin-bottom:4px}
.hero .big{font-size:44px;font-weight:500;letter-spacing:-1.5px;font-variant-numeric:tabular-nums;line-height:1.25}
.hero .sub{font-size:12.5px;color:var(--text3);margin-top:7px;display:flex;align-items:center;justify-content:center;gap:7px;flex-wrap:wrap}
.hero .sub .pill{background:var(--teal-bg);color:var(--teal);font-weight:500;padding:3px 9px;border-radius:99px;font-size:11.5px}
.hero .sub .pill.neg{background:var(--neg-bg);color:var(--neg)}
.hbar{height:6px;background:var(--bg2);border-radius:4px;margin-top:15px;overflow:hidden}

.inc-cta,.inc-row{display:flex;align-items:center;gap:12px;cursor:pointer;padding:14px 16px}

.mv .t2{font-size:12px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.inp{width:100%;background:var(--white);border:1.5px solid var(--line2);border-radius:12px;padding:10px 12px;font-size:14px;color:var(--text);outline:none;transition:border-color .15s}

.barrow{margin-bottom:15px;cursor:pointer;border-radius:10px;padding:4px 6px;margin-left:-6px;margin-right:-6px;transition:background .12s}
.barrow:hover{background:var(--bg)}
.barinfo{display:flex;justify-content:space-between;align-items:baseline;font-size:13.5px;margin-bottom:6px;gap:8px}

.banner{border-radius:14px;padding:13px 16px;font-size:13px;display:flex;gap:11px;align-items:flex-start;margin-bottom:14px}
.banner .bi{flex:none;margin-top:1px}
.banner.info{background:var(--white);border:1px solid var(--line);color:var(--text2)}
.banner.tip{background:var(--white);border:1px solid var(--line);color:var(--text2)}
.banner.warn{background:var(--accent-bg);color:var(--accent-d);border:1.5px solid var(--accent-bg2)}
.mini{font-size:12px;color:var(--text3)}
.hidden{display:none!important}
.cfgrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.cfgrow:first-child{border-top:none}

   Stejná značka jako v záhlaví appky: kulatý čtverec s přechodem z tvého
   akcentu do zlaté a mince uprostřed. Kreslí se v SVG přímo tady, takže

function faviconSVG(hex){
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">`
    +`<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">`
    +`<stop offset="0" stop-color="${shade(hex,-12)}"/>`
    +`<stop offset="1" stop-color="${shade(hex,42)}"/></linearGradient></defs>`
    +`<rect width="64" height="64" rx="15" fill="url(#g)"/>`
    +`<g fill="#fff"><rect x="16" y="12.5" width="36" height="10" rx="5"/>`
    +`<rect x="12" y="27" width="36" height="10" rx="5"/>`
    +`<rect x="15" y="41.5" width="36" height="10" rx="5"/></g></svg>`;
}

      c.getContext('2d').drawImage(img,0,0,180,180);set('favi180',c.toDataURL('image/png'));}catch(e){}};

   Naivní new Date(rok, měsíc+1, den) den nedrží — únor 31 si přepočítá na

function addMonth(isoStr){
  const d=new Date(isoStr),y=d.getFullYear(),m=d.getMonth();
  const posledni=new Date(y,m+2,0).getDate();   // poslední den cílového měsíce
  return iso(new Date(y,m+1,Math.min(d.getDate(),posledni)));
}

function migrate(s){
  s.periods||=[];s.envelopes||=[];s.investments||=[];s.debts||=[];s.accounts||=[];
  s.ui=s.ui||{};
  s.ui.activeAcc=s.ui.activeAcc||'';
  s.ui.defAcc=s.ui.defAcc||'';
  if(s.ui.defAcc&&!s.accounts.some(a=>a.id===s.ui.defAcc))s.ui.defAcc='';
  if(s.ui.activeAcc&&!s.accounts.some(a=>a.id===s.ui.activeAcc))s.ui.activeAcc='';   // smazaný účet nesmí zůstat "aktivní" naslepo
  /* Kdy appka začala vést sjednocený seznam Pohybů. Schválně se NEDOTAHUJE
     starší historie zpětně — appka ukazuje jen pohyby od tohohle data,
     stará data zůstávají beze změny vidět postaru v jednotlivých záložkách. */
  if(!s.ui.pohybyOd)s.ui.pohybyOd=todayISO();
  s.debts.forEach(d=>{d.paid0=d.paid0||0;d.monthly=d.monthly||0;d.group=d.group||'';d.pay||=[];d.paidToPrice=!!d.paidToPrice;d.fixDate=d.fixDate||'';});
  s.debtGroups=s.debtGroups||{};
  Object.keys(s.debtGroups).forEach(g=>{const gm=s.debtGroups[g];gm.contrib||=[];gm.ltv=gm.ltv||0;
    if(gm.ownPaid){gm.contrib.push({d:s.created||todayISO(),a:gm.ownPaid,n:'Původní vklad'});delete gm.ownPaid;}
    if(typeof gm.fees==='number'){gm.fees=gm.fees>0?[{d:s.created||todayISO(),a:gm.fees,n:'Poplatky'}]:[];}
    gm.fees||=[];});
  s.tax=(s.tax==null?CONFIG.taxRate:s.tax);
  delete s.stockKey;   // kurzy chodí přes Worker, klíč k burze už není potřeba
  s.ui||={};s.ui.appName||=CONFIG.appName;s.ui.accent||=CONFIG.accent;s.ui.numFont||=CONFIG.numFont||'system';s.ui.mena||='CZK';
  // Bahnschrift býval výchozí, ale je jen na Windows — kdo si ho sám nevybral, jede v Interu
  if(s.ui.numFont==='bahnschrift'&&!s.ui.numFontOwn)s.ui.numFont='system';
  /* Redesign 2026: kdo si barvu nikdy sám nezměnil (má pořád starou výchozí
     terracottu), dostane novou výchozí. Kdo si ji vybral, o ni nepřijde. */
  if(['#c4694a','#6d4fb3'].includes(s.ui.accent.toLowerCase())&&!s.ui.accentOwn)s.ui.accent=CONFIG.accent;
  if(!s.ui.tabs||!s.ui.tabs.length)s.ui.tabs=defTabs();
  // ensure new tabs exist (e.g. dluhy) & drop obsolete (byt)
  const have=new Set(s.ui.tabs.map(t=>t.id));
  defTabs().forEach(dt=>{if(!have.has(dt.id))s.ui.tabs.push(dt);});
  s.ui.tabs=s.ui.tabs.filter(t=>defTabs().some(d=>d.id===t.id));
  // Nastavení patří vždycky na konec — nová záložka se jinak přilepila až za něj
  s.ui.tabs=[...s.ui.tabs.filter(t=>t.id!=='nastaveni'),...s.ui.tabs.filter(t=>t.id==='nastaveni')];
  s.investments.forEach(i=>{i.rate=i.rate||0;if(i.lastInt===undefined)i.lastInt=null;i.hist||=[];
    // base = kolik jsi do toho vložil ze svého (bez zhodnocení); u starých dat dopočítáme
    if(i.base==null)i.base=Math.max(0,(i.val||0)-(i.hist||[]).filter(h=>!h.k).reduce((s2,h)=>s2+h.a,0));});
  if(!s.periods.length){const c=curCycleDates();const per=defPeriod('Výplata '+monthName(c.from),c.from,c.to);s.periods=[per];s.curId=per.id;}
  s.periods.forEach(pp=>(pp.cats||[]).forEach(c=>{if(!c.kind){const cfg=CONFIG.categories.find(x=>x.nm===c.nm);c.kind=cfg?cfg.kind:'need';}
    // obvyklá částka bývala vlastní číslo (it.amt) — dublovalo to plán,
    // takže je z ní zaškrtávátko a částka se bere z plánu
    (c.it||[]).forEach(it=>{if(typeof it.amt==='number'){if(!it.pl)it.pl=it.amt;it.fixAmt=true;delete it.amt;}});}));
  if(!s.curId&&s.periods[0])s.curId=s.periods[0].id;
  return s;
}

// .src = záznam vznikl z propojené položky výdajů → do „zbývá" se počítá už tam, tady ne (žádné dvojí počítání)
// .adj = oprava/historický zůstatek, ne nové odložení z výplaty tenhle cyklus
const savedInPeriod=pid=>S.envelopes.reduce((s,e)=>s+(e.hist||[]).filter(h=>h.pid===pid&&h.t==='in'&&!h.src&&!h.adj).reduce((ss,h)=>ss+h.a,0),0);
// h.k='gain' = zhodnocení/úrok, ne tvoje vložené peníze
const investedInPeriod=pid=>S.investments.reduce((s,i)=>s+(i.hist||[]).filter(h=>h.pid===pid&&!h.src&&!h.k).reduce((ss,h)=>ss+h.a,0),0);
const invIn=inv=>(inv.base||0)+(inv.hist||[]).filter(h=>!h.k).reduce((s,h)=>s+h.a,0);
const invGain=inv=>(inv.val||0)-invIn(inv);
/* Kolik s tím pohnul trh za poslední období. Počítá se jen ze záznamů
   `k:'gain'`, takže vlastní vklady výsledek nezkreslí. Hodnota k datu se
   dopočítá zpětně stejně jako u grafu jmění. */
const invGainSince=(inv,t)=>(inv.hist||[]).filter(x=>x.k==='gain'&&x.d>t).reduce((s,x)=>s+(x.a||0),0);
const invValAt=(inv,t)=>{let v=inv.val||0;(inv.hist||[]).forEach(x=>{if(x.d&&x.d>t)v-=(x.a||0);});return v;};
function invTrend(inv){
  const all=(inv.hist||[]).filter(x=>x.d);
  if(!all.some(x=>x.k==='gain'))return '';      // bez kurzu není co ukazovat
  // okno se schová, když tak dlouho investici ještě nemáš — jinak by
  // „za rok +50 %" znamenalo ve skutečnosti „za deset dní, co ji mám"
  const first=all.reduce((a,b)=>a.d<b.d?a:b).d;
  return [{d:30,l:'30 dní'},{d:365,l:'rok'}].map(w=>{
    const t=iso(new Date(Date.now()-w.d*864e5));
    if(first>t)return null;                       // tak daleko historie nesahá, nelži
    const g=invGainSince(inv,t),base=invValAt(inv,t);
    const pc=base>0?Math.round(g/base*1000)/10:0;
    return `<span class="mini">${w.l} <b style="color:${g>=0?'var(--teal)':'var(--neg)'}">${g>=0?'+':'−'}${fm(Math.abs(g))}${base>0?` (${g>=0?'+':'−'}${(''+Math.abs(pc)).replace('.',',')} %)`:''}</b></span>`;
  }).filter(Boolean).join('<span class="mini" style="opacity:.35">·</span>');
}

let _fx={},_fxAt=0;
async function fetchFx(ccy){
  ccy=(ccy||'CZK').toUpperCase();

/* Přípony burz se pamatují blbě (Amsterdam je .AS, ne .NL) a samotné
   „symbol nenalezen" člověka nikam neposune. Když se papír nenajde,
   zkusí se tentýž základ na obvyklých burzách — jedním dotazem — a
   nabídne se, co existuje. Běží to jen při neúspěchu. */
const BURZY=['','.PR','.AS','.DE','.L','.PA','.MI','.SW','.VI','.F','.ST','.BR'];
/* Brokeři značí burzu podle ZEMĚ (XTB: IMAE.NL), burzovní data podle
   BURZY (IMAE.AS). Uživatel opíše symbol z brokera a nefunguje mu —
   tak ho přeložíme sami, místo abychom po něm chtěli, ať si to najde. */
const BURZA_MAP={NL:'AS',UK:'L',GB:'L',FR:'PA',IT:'MI',ES:'MC',CH:'SW',AT:'VI',
  BE:'BR',PT:'LS',CZ:'PR',SE:'ST',DK:'CO',NO:'OL',FI:'HE',PL:'WA',IE:'IR',US:''};
function mapSymbol(sym){
  const m=/^(.+)\.([A-Za-z]{2})$/.exec(sym||'');
  if(!m)return [];
  const cil=BURZA_MAP[m[2].toUpperCase()];
  if(cil===undefined)return [];
  const zaklady=[m[1]];
  // Severské burzy píšou třídu akcie s pomlčkou (NOVO-B, VOLV-B),
  // brokeři ji vynechávají — zkus obě podoby
  const h=/^(.{2,})([ABC])$/.exec(m[1]);
  if(h&&m[1].indexOf('-')<0)zaklady.push(h[1]+'-'+h[2]);
  return zaklady.map(z=>cil?z+'.'+cil:z).filter(x=>x!==sym);
}

/* ---------- zařazení zápisu podle data ----------
   Výdaj patří do období, do kterého spadá jeho datum, ne do toho, které
   máš zrovna otevřené. Jinak zpětný zápis („včera jsem zapomněl")
   spadne do špatného cyklu a rozhodí statistiky.
   Konec období je výlučný, protože nové období začíná dnem `to`
   předchozího — na hranici tak zápis patří tomu novějšímu. Když datum
   nespadá nikam (mezera mezi obdobími), bere se nejbližší shoda včetně
   krajů, a když ani ta ne, zůstane v otevřeném období. */
function periodForDate(d){
  if(!d)return null;
  return S.periods.find(p=>p.from<=d&&d<p.to)||S.periods.find(p=>p.from<=d&&d<=p.to)||null;
}
/* Kam zapsat nový záznam. Období se dotýkají: nové začíná dnem, kterým to
   předchozí končí. Hraniční den proto pravidlo from<=d<to přiřkne tomu
   novějšímu, jenže když se zrovna díváš na to starší, mínil jsi skoro
   jistě jeho. Na hraničním dni tedy vyhrává otevřené období, jinde
   rozhoduje dál čistě datum, aby šlo dopisovat starší účtenky. */
function periodForEntry(d){
  if(!d)return null;
  const cur=P();
  if(cur&&cur.from<=d&&d<=cur.to)return cur;
  return periodForDate(d);
}

  if(val.startsWith('inv:')){const i=S.investments.find(x=>x.id===val.slice(4));return i?i.nm:'Investice';}
  if(val.startsWith('debt:')){const d=S.debts.find(x=>x.id===val.slice(5));return d?d.nm:'Dluh';}
  return val;
}

const logIdsOf=cats=>{const ids=[];(cats||[]).forEach(c=>(c.it||[]).forEach(it=>(it.log||[]).forEach(le=>ids.push(le.id))));return ids;};

const itemKind=(it,c)=>it.kind||(it.link?'save':(c.kind||'need'));

function futureMonthStr(n){const d=new Date();d.setDate(1);d.setMonth(d.getMonth()+n);return (d.getMonth()+1)+'/'+d.getFullYear();}
function monthsBetween(a,b){return Math.max(1,(b.getFullYear()-a.getFullYear())*12+(b.getMonth()-a.getMonth()));}
// jádro amortizace: kolik měsíců (n) a kolik na úrocích (interest), fixní úrok po celou dobu
function amortize(B,pay,rateAnnual){
  const r=(rateAnnual||0)/100/12;
  if(B<=0)return{n:0,interest:0,total:0};
  if(pay<=0)return null;
  if(r===0){const n=Math.ceil(B/pay);return{n,interest:0,total:B};}
  const mi=B*r;if(pay<=mi)return{never:true};
  const n=Math.ceil(-Math.log(1-r*B/pay)/Math.log(1+r));
  return{n,interest:Math.max(0,Math.round(pay*n-B)),total:B+Math.max(0,Math.round(pay*n-B))};
}
// jako amortize, ale s jednou plánovanou změnou úroku (fixace) k danému datu
function amortizeFix(B,pay,rate1,fixDate,rate2){
  if(!fixDate||rate2==null||rate2==='')return amortize(B,pay,rate1);
  const monthsToFix=monthsBetween(new Date(),new Date(fixDate+'T00:00:00'));
  if(monthsToFix<=0)return amortize(B,pay,rate1);
  if(pay<=0)return null;
  const r1=(rate1||0)/100/12;let bal=B,interest=0,n=0;
  for(let i=0;i<monthsToFix&&bal>0;i++){
    const mInt=bal*r1;
    if(pay<=mInt)return{never:true};
    bal=Math.max(0,bal-(pay-mInt));interest+=mInt;n++;
  }
  if(bal<=0)return{n,interest:Math.round(interest),total:B+Math.round(interest)};
  const rest=amortize(bal,pay,rate2);
  if(!rest)return null;
  if(rest.never)return{never:true};
  return{n:n+rest.n,interest:Math.round(interest+rest.interest),total:B+Math.round(interest+rest.interest)};
}
function debtPayoff(d){const B=debtRemaining(d);if(B<=0)return{done:true};
  const r=amortizeFix(B,d.monthly||0,d.rate||0,d.fixDate,d.rateAfter);
  if(!r)return null;if(r.never)return{never:true};
  return{n:r.n,interest:r.interest,date:futureMonthStr(r.n)};}
// odhad celkových nákladů dluhu OD ZAČÁTKU (z celé jistiny, ne z aktuálního zbytku) — "kolik na tom opravdu zaplatíš"
function debtLifetimeCost(d){const B=d.principal||0;if(B<=0)return{interest:0,total:0};
  if(!d.monthly)return{unknown:true,total:B};
  const r=amortizeFix(B,d.monthly,d.rate||0,d.fixDate,d.rateAfter);
  if(!r)return{unknown:true,total:B};if(r.never)return{never:true,total:B};
  return{interest:r.interest,total:r.total};}
// opačný výpočet: znám dobu splácení, chci vědět měsíční splátku (anuitní vzorec)
function annuityPayment(B,rateAnnual,nMonths){
  if(!(B>0)||!(nMonths>0))return 0;
  const r=(rateAnnual||0)/100/12;
  if(r===0)return Math.ceil(B/nMonths);
  return Math.ceil(B*r/(1-Math.pow(1+r,-nMonths)));
}
// živý náhled v modalu — stejná logika, ale z rozepsaných hodnot formuláře (dluh ještě neexistuje)
function loanPreview(principal,rate,monthly,fixDate,rateAfter){
  if(!(principal>0))return null;
  if(!(monthly>0))return{unknown:true};
  const r=amortizeFix(principal,monthly,rate,fixDate,rateAfter);
  if(!r)return{unknown:true};if(r.never)return{never:true};
  return{n:r.n,date:futureMonthStr(r.n),interest:r.interest,total:r.total};}

/* ---------- interest auto-credit (1. dne v měsíci, po dani) ---------- */
function firstOfMonth(d){return new Date(d.getFullYear(),d.getMonth(),1);}
function creditInterest(){
  const today=new Date();today.setHours(0,0,0,0);let changed=false;
  S.investments.forEach(inv=>{
    if(!inv.rate||inv.rate<=0)return;
    if(!inv.lastInt){inv.lastInt=iso(firstOfMonth(today));changed=true;return;}
    let cur=new Date(inv.lastInt+'T00:00:00');
    // advance to each subsequent 1st that is <= today
    while(true){
      const next=new Date(cur.getFullYear(),cur.getMonth()+1,1);
      if(next>today)break;
      const gross=(inv.val||0)*inv.rate/100/12;
      const net=Math.round(gross*(1-(S.tax||0)/100));
      if(net!==0){inv.val=(inv.val||0)+net;inv.hist.push({d:iso(next),a:net,n:'Úrok (po dani '+(S.tax||0)+' %)',k:'gain'});}
      inv.lastInt=iso(next);cur=next;changed=true;
    }
  });
  if(changed)saveLS();
}

  const invHas=(s.investments||[]).some(i=>(i.val||0)||(i.hist||[]).length);
  return !perHas&&!envHas&&!invHas&&!(s.debts||[]).length&&!Object.keys(s.debtGroups||{}).length;}
const netErr=e=>/Failed to fetch|NetworkError|Load failed/i.test((e&&e.message)||'');
const CLOUD_DOWN='Cloud je nedostupný — projekt může být pozastavený nebo offline. Data máš zatím jen v tomhle zařízení.';

let pushTimer=null,pushing=false;
function schedulePush(){if(!syncOn())return;clearTimeout(pushTimer);pushTimer=setTimeout(doPush,1500);}
async function doPush(){if(pushing||!syncOn())return;
  if(stateEmpty(S)){syncState='err';syncMsg='Do cloudu se nenahrává prázdný stav (pojistka proti přepsání dat).';updateSavePill();return;}
  pushing=true;
  try{S.mt=S.mt||Date.now();await wkPush(S);syncState='ok';syncMsg='';}
  catch(e){syncState='err';syncMsg=netErr(e)?CLOUD_DOWN:'Nepovedlo se uložit do cloudu';}
  pushing=false;updateSavePill();}

async function syncNow(silent){ // sladí cloud a zařízení — vyhrává novější
  if(!syncOn())return;
  syncState='syncing';if(!silent)R();else updateSavePill();
  try{
    const row=await wkPull();
    if(!row){ // v cloudu nic nevidíme → buď první připojení, nebo výpadek
      if(!silent)return firstLoginChoice();
      // tiché nahrání jen když je co nahrát — prázdný stav by přepsal dobrá data
      if(stateEmpty(S)){syncState='err';syncMsg='Cloud nevrátil žádná data a v tomhle zařízení nic není — radši nic nenahrávám.';updateSavePill();return;}
      await wkPush(S);syncState='ok';updateSavePill();return;}
    const cloudMt=+row.mt||0,localMt=+S.mt||0;
    if(cloudMt>localMt){pushBackup();S=migrate(row.data);S.mt=cloudMt;saveLS();applyTheme();if(!silent)toast('Staženo z cloudu');}
    else if(localMt>cloudMt){
      if(stateEmpty(S)&&!stateEmpty(row.data||{})){ // lokálně prázdno, v cloudu data → stáhni, nepřepisuj
        pushBackup();S=migrate(row.data);S.mt=cloudMt;saveLS();applyTheme();if(!silent)toast('Staženo z cloudu');}
      else{await wkPush(S);if(!silent)toast('Nahráno do cloudu');}}
    syncState='ok';syncMsg='';R();
  }catch(e){syncState='err';syncMsg=netErr(e)?CLOUD_DOWN:'Synchronizace se nepovedla';R();}}

function firstLoginChoice(){ // cloud je prázdný — co s daty v tomhle zařízení
  openModal(`<h3>Cloud je zatím prázdný</h3><div class="md">Připojení proběhlo. Co chceš udělat s daty, která máš v tomhle zařízení?</div>
    <div class="macts" style="flex-direction:column">
      <button class="btn fill" onclick="finishFirstLogin(true)">Nahrát je do cloudu</button>
      <button class="btn" onclick="finishFirstLogin(false)">Začít načisto</button></div>
    <p class="mini" style="margin-top:12px">Při „začít načisto" se současná data neztratí — uloží se do interní zálohy a pořád si je můžeš stáhnout.</p>`);}
async function finishFirstLogin(keep){closeModal();
  try{if(!keep){pushBackup();const ui=S.ui;S=defState();S.ui=ui;}
    S.mt=Date.now();saveLS();await wkPush(S);syncState='ok';toast(keep?'Data nahrána do cloudu':'Začínáme načisto');applyTheme();R();
  }catch(e){syncState='err';syncMsg='Nepovedlo se uložit do cloudu';R();}}

function wconfirmSimple(m){return confirm(m);}

/* ---- připojení k vlastnímu Workeru ---- */
async function wkCreate(){ // první zařízení: adresa + vygenerovaný tajný kód
  const url=(document.getElementById('wk_url').value||'').trim().replace(/\/+$/,'');
  if(!/^https:\/\/.+/.test(url)){toast('Vlož adresu Workeru (https://…)');return;}
  syncState='syncing';syncMsg='Ověřuji Worker…';R();
  try{const r=await fetch(url+'/ping');if(!r.ok)throw new Error('ping '+r.status);}
  catch(e){syncState='err';syncMsg='Na téhle adrese Worker neodpovídá. Zkontroluj ji a že je nasazený (viz SYNC-SETUP.md).';R();return;}
  sync={url,code:newSyncCode()};saveSync();
  S.ui.codeSaved=false;   // čerstvý kód nikdo nikde nemá — připomeň ho uložit
  try{S.mt=Date.now();await wkPush(S);syncState='ok';syncMsg='';toast('Připojeno, data nahrána');R();}
  catch(e){sync=null;saveSync();syncState='err';syncMsg='Připojení se nepovedlo: '+e.message;R();}}
async function wkJoin(){ // další zařízení: vlož připojovací kód z prvního
  const c=parseConn(document.getElementById('wk_conn').value);
  if(!c){toast('Připojovací kód nevypadá správně');return;}
  syncState='syncing';syncMsg='Připojuji…';R();
  sync=c;saveSync();
  S.ui.codeSaved=true;    // kód jsi sem odněkud vložil, takže ho někde máš
  try{await syncNow(false);if(syncState!=='err')toast('Připojeno');}
  catch(e){syncState='err';syncMsg='Připojení se nepovedlo';R();}}
function wkCopyConn(){const s=connStr();if(!s)return;
  navigator.clipboard?.writeText(s).then(()=>toast('Připojovací kód zkopírován'),()=>toast('Zkopíruj ho ručně'));}
function markCodeSaved(){S.ui.codeSaved=true;toast('Díky — víc už to připomínat nebudu');commit();}
function codeSavePrompt(){if(!syncOn())return;
  openModal(`<h3>Připojovací kód</h3><div class="md">Tohle je jediný klíč k datům v cloudu a žije jen v tomhle prohlížeči. Ulož si ho někam mimo počítač — do správce hesel, poznámek v telefonu, nebo si ho pošli mailem. <b>Kdo ho má, vidí tvůj rozpočet</b>, ber ho jako heslo.</div>
    <div class="fg"><input class="inp" readonly value="${esc(connStr())}" style="font-family:ui-monospace,monospace;font-size:12px" onclick="this.select()"></div>
    <div class="macts"><button class="btn" onclick="wkCopyConn()">Zkopírovat</button><button class="btn fill" onclick="markCodeSaved();closeModal()">Mám uloženo</button></div>`);}
async function wkVersions(){ // denní verze uložené ve Workeru
  if(!syncOn())return;
  try{const r=await wkFetch('/list');if(!r.ok)throw new Error('list '+r.status);

      <div class="fg"><span class="fl">Ze dne</span><select class="inp" id="wk_day">${days.map(d=>`<option value="${d}">${fdFull(d)}</option>`).join('')}</select></div>

  }catch(e){toast(netErr(e)?'Úložiště neodpovídá':'Nepovedlo se načíst starší verze');}}
async function wkRestore(){const d=document.getElementById('wk_day').value;closeModal();
  try{const r=await wkFetch('/snap/'+d);if(!r.ok)throw new Error('snap '+r.status);
    const j=await r.json();if(!j||!j.data)throw new Error('prázdná verze');
    pushBackup();S=migrate(j.data);S.mt=Date.now();saveLS();applyTheme();
    await doPush();toast('Obnoveno ze dne '+fdFull(d));R();
  }catch(e){toast('Obnovení se nepovedlo');}}
function wkDisconnect(){if(!wconfirmSimple('Odpojit tohle zařízení od synchronizace? Data v cloudu ani tady se nesmažou.'))return;
  sync=null;saveSync();syncState='off';syncMsg='';toast('Odpojeno');R();}

/* ---------- save pill ---------- */
function updateSavePill(){const el=document.getElementById('savepill');if(!el)return;
  if(syncOn()){
    const map={syncing:['warn','Synchronizuji…'],err:['warn','Cloud: chyba — klikni'],ok:['ok','Uloženo v cloudu'],off:['ok','Uloženo v cloudu'],out:['ok','Uloženo v cloudu']};
    const [cls,txt]=map[syncState]||map.ok;
    el.className='save-pill '+cls;el.innerHTML='<span class="d"></span> '+txt;el.onclick=()=>go('nastaveni');return;}

/* ---------- pevné platby ----------
   Položky s `fixAmt` se platí každý cyklus stejně, takže appka umí
   ukázat, co už je odbyté a co ne. Odklikává se **po jedné** — žádné
   „zaplatit všechny", to uživatel výslovně nechce (viz CLAUDE.md).
   Zaplaceno = má v tomhle cyklu aspoň jeden zápis. */
function fixedRows(p){const r=[];p.cats.forEach(c=>c.it.forEach(it=>{if(it.fixAmt&&it.pl>0)r.push({c,it,a:itemActual(it)});}));return r;}
function fixedBlock(p){
  const rows=fixedRows(p);if(!rows.length)return '';
  /* Zaplatit zapisuje podle DNEŠNÍHO data (viz logToDate), takže když se
     díváš na jiný cyklus, než do kterého dnešek patří, tlačítko by zapsalo
     jinam a řádek by dál nabízel zaplacení — dalo by se tak omylem zaplatit
     několikrát. V takovém případě se tlačítka schovají a řekne se proč. */
  const dnesni=periodForDate(todayISO());
  const mimo=!dnesni||dnesni.id!==p.id;
  const done=rows.filter(r=>r.a>0).length,zbyva=rows.filter(r=>!r.a).reduce((s,r)=>s+r.it.pl,0);
  let h=`<div class="card"><div class="ch"><span class="ct">${ic('repeat',15)} Pevné platby</span>
    <span class="mini">${done}/${rows.length} zaplaceno${zbyva>0?` · zbývá ${fm(zbyva)}`:''}</span></div>`;
  if(mimo)h+=`<div class="mini" style="margin-bottom:10px">${ic('zap',13)} Díváš se na jiný cyklus, než do kterého patří dnešek${dnesni?` (${esc(dnesni.nm)})`:''}. Zaplacení jedním klikem je proto vypnuté — zapiš platbu u položky s datem, ať skončí tam, kam patří.</div>`;
  rows.forEach(({c,it,a})=>{h+=`<div class="row" style="cursor:default">
    <div class="ic" style="background:${a>0?'var(--teal-bg)':'var(--bg2)'};color:${a>0?'var(--teal)':'var(--text3)'}">${ic(a>0?'check':c.icon,18)}</div>
    <div class="m"><div class="t1"${a>0?' style="color:var(--text3)"':''}>${esc(it.nm)}</div><div class="t2">${esc(c.nm)} · ${fmEx(it.pl)}${linkTarget(it)?' → '+esc(linkTarget(it).obj.nm):''}</div></div>
    ${a>0?`<span class="tag ok">${fm(a)}</span>`
         :mimo?`<span class="mini">nezaplaceno</span>`
         :`<button class="btn sm fill" onclick="payFixed('${c.id}','${it.id}')">Zaplatit</button>`}</div>`;});
  return h+`</div>`;
}
function payFixed(cid,iid){
  const c=P().cats.find(x=>x.id===cid),it=c&&c.it.find(x=>x.id===iid);if(!it||!(it.pl>0))return;
  const dnesni=periodForDate(todayISO());
  if(!dnesni||dnesni.id!==P().id){toast('Dnešek patří do jiného cyklu — zapiš platbu s datem');return;}
  if(itemActual(it)>0){toast('Tahle platba už je v cyklu zapsaná');return;}
  const r=logToDate(c,it,{id:uid(),d:todayISO(),a:it.pl,n:''});
  const lt=linkTarget(it);
  toast(`${it.nm}: ${fmEx(it.pl)}`+(lt?` → ${lt.obj.nm}`:'')+(r.jinam?` · ${r.period.nm}`:''));commit();
}

/* ---------- PŘEHLED ---------- */
function vPrehled(p){
  const base=incBase(p),exp=sumActual(p),saved=savedInPeriod(p.id),inv=investedInPeriod(p.id),debt=debtPaidInPeriod(p);
  const free=freeLeft(p);
  const pct=base>0?Math.min(100,Math.max(0,(1-free/base)*100)):0;
  const barCol=free<0?'var(--neg)':pct>85?'var(--gold)':'var(--teal)';
  const days=Math.max(1,Math.round((new Date(p.to)-new Date(p.from))/864e5));
  const elapsed=Math.max(0,Math.min(days,Math.round((new Date()-new Date(p.from))/864e5)));
  const left=Math.max(0,days-elapsed);const perDay=left>0?free/left:free;
  let h='';
  // výpadek cloudu musí být vidět — jinak si člověk myslí, že je zálohovaný, a není
  if(syncOn()&&syncState==='err')
    h+=`<div class="banner warn"><span class="bi">${ic('zap',18)}</span><div><b>Synchronizace nefunguje.</b> ${esc(syncMsg||'Nepovedlo se spojit s cloudem.')} <a onclick="exportData()">Stáhnout zálohu →</a> <a onclick="syncNow()" style="margin-left:10px">Zkusit znovu</a></div></div>`;
  // Se zapnutou synchronizací už data nedrží jen prohlížeč, takže strašit
  // souborem nemá smysl. Reálná díra je jinde: připojovací kód žije taky
  // jen v localStorage, takže smazání dat webu odstřihne appku od cloudu.
  if(syncOn()){
    if(!S.ui.codeSaved)h+=`<div class="banner tip"><span class="bi">${ic('shield',18)}</span><div><b>Ulož si připojovací kód mimo tenhle počítač.</b> Data máš i v cloudu, ale klíč k nim žije jen tady v prohlížeči — kdyby smazal data webu, vezme to i kód a appka se k cloudu sama nedostane. Stačí mail sám sobě nebo správce hesel. <a onclick="codeSavePrompt()">Ukázat kód →</a> <a onclick="markCodeSaved()" style="margin-left:10px">Mám uloženo</a></div></div>`;
  }
  else if(fsaSupported()&&!fileOK)h+=`<div class="banner warn"><span class="bi">${ic('shield',18)}</span><div><b>Ochrana dat:</b> ${fileHandle?'Klikni na „Klikni pro připojení" nahoře a potvrď přístup.':'Připoj datový soubor, ať už nikdy nepřijdeš o data.'} <a onclick="connectFile()">Připojit soubor →</a></div></div>`;
  else if(!fsaSupported()&&(!S.lastExport||Date.now()-new Date(S.lastExport+'T00:00:00').getTime()>7*864e5))
    h+=`<div class="banner warn"><span class="bi">${ic('shield',18)}</span><div><b>Data jsou jen v tomhle zařízení.</b> Telefon a počítač mají každý svoje — nepropojí se samy. Občas si stáhni zálohu. <a onclick="exportData()">Stáhnout zálohu →</a></div></div>`;
  const steps=[
    {ok:base>0,t:'Nastav si příjem',s:'kolik čekáš / kolik přišlo tenhle cyklus',fn:'incomeModal()',c:'var(--accent-bg)',fg:'var(--accent-d)'},
    {ok:sumPlan(p)>0,t:'Naplánuj měsíční výdaje',s:'kolik chceš utratit v každé kategorii',fn:'plansModal()',c:'var(--teal-bg)',fg:'var(--teal)'},
    syncOn()
      ? {ok:!!S.ui.codeSaved,t:'Ulož si připojovací kód',s:'mimo tenhle počítač — je to klíč k datům v cloudu',fn:'codeSavePrompt()',c:'var(--cyan-bg)',fg:'var(--cyan)'}
      : fsaSupported()
      ? {ok:fileOK,t:'Připoj datový soubor',s:'ať se všechno samo ukládá na disk',fn:'connectFile()',c:'var(--cyan-bg)',fg:'var(--cyan)'}
      : {ok:!!S.lastExport,t:'Stáhni si zálohu',s:'ať o data nikdy nepřijdeš',fn:'exportData()',c:'var(--cyan-bg)',fg:'var(--cyan)'},
  ];
  const doneCount=steps.filter(s=>s.ok).length;
  if(doneCount<steps.length&&!S.ui.hideIntro){
    h+=`<div class="card"><div class="ch" style="margin-bottom:10px"><span class="ct">${ic('rocket',15)} Začínáme — ${doneCount}/${steps.length} hotovo</span><button class="btn gho sm" onclick="hideIntro()">Skrýt</button></div>`;
    steps.forEach((st,i)=>{h+=`<div class="row" style="cursor:pointer;${st.ok?'opacity:.55':''}" onclick="${st.fn}">
      <div class="ic" style="background:${st.ok?'var(--teal-bg)':st.c};color:${st.ok?'var(--teal)':st.fg};font-weight:500">${st.ok?ic('check',18):(i+1)}</div>
      <div class="m"><div class="t1" style="${st.ok?'text-decoration:line-through':''}">${st.t}</div><div class="t2">${st.s}</div></div>
      <span style="color:var(--text4)">${st.ok?'':ic('cright',16)}</span></div>`;});
    h+=`</div>`;
  }
  h+=accChips();
  h+=`<div class="hero">
    <div class="lbl">Zbývá volných z výplaty</div>
    <div class="big ${free<0?'neg':''}">${fm(free)}</div>
    <div class="sub">${left>0?`<span class="pill ${free<0?'neg':''}">${fm(perDay)} / den</span><span>${left} dní do výplaty</span>`:'<span>poslední den cyklu</span>'}</div>
    <div class="hbar"><i style="width:${pct}%;background:${barCol}"></i></div>
    <div class="hstats">
      <div><span>Příjem</span><b class="pos">${fm(base)}</b></div>
      <div><span>Utraceno</span><b>${fm(exp)}</b></div>
      <div><span>Odloženo</span><b class="warn">${fm(saved)}</b></div>
      ${inv?`<div><span>Investováno</span><b style="color:var(--cyan)">${fm(inv)}</b></div>`:''}
      ${debt?`<div><span>Splátky</span><b style="color:var(--blue)">${fm(debt)}</b></div>`:''}
    </div></div>`;
  h+=actionRow();
  /* Příjem se zadává v den výplaty, ne dopředu jako plán. Dokud za cyklus
     nic nepřišlo, je tenhle blok výzva hned pod hlavním číslem; jakmile
     výplata dorazí, ztichne do obyčejného řádku. Dřív byl až úplně dole
     pod Pohyby a Pevnými platbami, takže si ho nikdo nevšiml. */
  h+=incomeBlock(p);
  const plan=sumPlan(p),afterPlan=base-plan;
  if(plan>0)h+=`<div class="tiles">
    <div class="tile"><div class="tl">Naplánováno</div><div class="tv">${fm(plan)}</div></div>
    <div class="tile"><div class="tl">Výplata − plán</div><div class="tv ${afterPlan<0?'neg':'pos'}">${fm(afterPlan)}</div></div>
    <div class="tile"><div class="tl">Z plánu utraceno</div><div class="tv">${Math.round(exp/plan*100)} %</div></div></div>`;
  h+=vPohybyList();
  h+=fixedBlock(p);

  h+=`<div class="card"><div class="ch"><span class="ct">Kam jdou peníze</span><a onclick="go('vydaje')">detail →</a></div>`;
  const cats=p.cats.map((c,i)=>({c,a:catActualDisplay(c,p.id),pl:catPlan(c),i})).filter(x=>x.a>0||x.pl>0).sort((a,b)=>b.a-a.a);
  if(!cats.length)h+=`<div class="empty">Zatím žádné výdaje. Přidej první přes „Rychlý výdaj".</div>`;
  cats.forEach(({c,a,pl,i})=>{const mx=Math.max(a,pl,1),over=a>pl&&pl>0;
    h+=`<div class="barrow" onclick="openCat('${c.id}')"><div class="barinfo"><span class="n"><span style="color:${col(i)}">${ic(c.icon,16)}</span>${esc(c.nm)}</span><span class="v">${fm(a)}${pl?' / '+fm(pl):''}</span></div>
      <div class="track"><div class="plan" style="width:${pl/mx*100}%;background:${col(i)}"></div><div class="act" style="width:${a/mx*100}%;background:${over?'var(--neg)':col(i)}"></div></div></div>`;});
  if(cats.length)h+=`<div class="totals"><span style="color:var(--text3)">Celkem výdaje</span><span class="num">${fm(sumPlan(p))} → ${fm(sumActualDisplay(p))}</span></div>`;
  h+=`</div>`;
  h+=`<div class="grid3">

/* ---------- VÝDAJE ---------- */
/* Hlavička podstránky ve stejném stylu jako Přehled: popisek, velké

function pageHero(lbl,val,sub,color){
  return `<div class="phero"><div class="lbl">${lbl}</div>

}

      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px">

        <div style="display:flex;gap:1px" onclick="event.stopPropagation()">
          <button class="ib" style="padding:4px${i===0?';opacity:.25;pointer-events:none':''}" title="Posunout dřív" onclick="moveCat('${c.id}',-1)">${ic('cleft',13)}</button>
          <button class="ib" style="padding:4px${i===p.cats.length-1?';opacity:.25;pointer-events:none':''}" title="Posunout později" onclick="moveCat('${c.id}',1)">${ic('cright',13)}</button>
        </div></div>
      <div class="cn">${esc(c.nm)}</div><div class="cv" style="color:${over?'var(--neg)':'var(--text)'}">${fm(a)}</div>
      <div class="cmeta"><span>Plán ${fm(pl)}</span>${pl?`<span style="font-weight:500;color:${over?'var(--neg)':pu>70?'var(--gold)':'var(--teal)'}">${pu}%</span>`:''}</div>
      ${(pl||a)?`<div class="track" style="height:6px"><div class="plan" style="width:${pl/Math.max(a,pl,1)*100}%;background:${col(i)}"></div><div class="act" style="width:${a/Math.max(a,pl,1)*100}%;background:${over?'var(--neg)':col(i)}"></div></div>`:''}

  h+=`</div><button class="adddash" onclick="catModal()">${ic('plus',16)} Přidat kategorii</button>`;

    h+=`</div>`;});

/* ---------- OBÁLKY ---------- */
function vObalky(p){
  let h=tipBan('bulb','Obálka = peníze odložené na účel. <b>Vklad</b> se rovnou započítá jako „odloženo" (žádné dvojí psaní). Když <b>čerpáš</b>, jen ubyde z obálky. Zapisuješ starší úspory, co jsi neodkládal teď z výplaty? Uprav zůstatek přímo v ✏️ — nesrazí ti to zbytečně tenhle cyklus.');
  h+=pageHero('Odloženo v obálkách',fm(totalEnvelopes()),`tento cyklus ${fm(savedInPeriod(p.id))}`,'var(--gold)');
  h+=`<div style="text-align:center;margin-bottom:16px"><button class="btn fill" onclick="envModal()">${ic('plus',15)} Nová obálka</button></div>`;
  if(!S.envelopes.length)h+=`<div class="card"><div class="empty">Zatím žádné obálky.</div></div>`;
  S.envelopes.forEach((e,i)=>{const hasT=e.target>0,pc=hasT?Math.min(100,Math.round(e.bal/e.target*100)):0;const remain=Math.max(0,(e.target||0)-e.bal),months=e.monthly>0?Math.ceil(remain/e.monthly):null;
    h+=`<div class="card">
      <div class="ch"><span style="font-size:16px;font-weight:500;display:flex;align-items:center;gap:10px"><span class="mvi" style="width:34px;height:34px;background:${col(i)}1c;color:${col(i)}">${ic(e.icon,18)}</span>${esc(e.nm)}</span>
        <div style="display:flex;gap:4px">
          <button class="btn sm" style="color:var(--teal);border-color:var(--teal-bg)" onclick="envMove('${e.id}','in')">${ic('plus',14)} Vložit</button>
          <button class="btn sm" onclick="envMove('${e.id}','out')">Čerpat</button>
          <button class="ib" onclick="envModal('${e.id}')">${ic('edit',15)}</button><button class="ib" onclick="delEnv('${e.id}')">${ic('trash',15)}</button></div></div>
      <div class="${hasT?'grid3':'grid2'}">
        <div style="text-align:center"><div class="mini">Zůstatek</div><div class="num" style="font-size:22px;color:${e.bal>0?'var(--gold)':'var(--text4)'}">${fm(e.bal||0)}</div></div>
        <div style="text-align:center"><div class="mini">Měsíčně</div><div class="num" style="font-size:22px">${fm(e.monthly||0)}</div></div>
        ${hasT?`<div style="text-align:center"><div class="mini">Cíl</div><div class="num" style="font-size:22px;color:var(--cyan)">${fm(e.target)}</div></div>`:``}</div>`;
    if(hasT){const pcol=pc>=100?'var(--teal)':pc>50?'var(--gold)':'var(--accent)';h+=`<div style="margin-top:14px"><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:6px"><span style="font-weight:500;color:${pcol}">${pc}%</span><span class="mini">${pc>=100?'splněno':'zbývá '+fm(remain)+(months?` · ~${months} měs.`:'')}</span></div><div class="prog"><i style="width:${pc}%;background:${pcol}"></i></div></div>`;}
    if(e.due&&e.target>0&&remain>0){const mtd=monthsBetween(new Date(),new Date(e.due+'T00:00:00'));const req=Math.ceil(remain/mtd);h+=`<div class="mini" style="margin-top:8px">Do ${fdFull(e.due)} (~${mtd} měs.) odkládej ~<b>${fm(req)}</b>/měs${e.monthly>0?` — teď ${fm(e.monthly)}, ${e.monthly>=req?'stačí':'málo'}`:''}</div>`;}
    const histAll=e.hist||[];const hist=histAll.filter(x=>x.pid===p.id&&!x.adj).slice(-4).reverse();
    if(hist.length){h+=`<div style="margin-top:14px;padding-top:12px;border-top:1.5px solid var(--line)"><div class="mini" style="margin-bottom:6px">Tento cyklus</div>`;hist.forEach(x=>{const oi=histAll.indexOf(x);h+=`<div style="display:flex;justify-content:space-between;align-items:center;font-size:12.5px;padding:3px 0"><span><span class="tag ${x.t==='in'?'ok':'bd'}" style="margin-right:6px">${x.t==='in'?'vklad':'čerpáno'}</span>${esc(x.n||'')}${x.cat?` · ${esc(x.cat)}`:''}</span><span style="display:flex;align-items:center;gap:6px"><span class="num" style="font-weight:500;color:${x.t==='in'?'var(--teal)':'var(--neg)'}">${x.t==='in'?'+':'−'}${fm(x.a)}</span><button class="ib" onclick="delEnvHist('${e.id}',${oi})">${ic('x',12)}</button></span></div>`;});h+=`</div>`;}
    h+=`</div>`;});

/* ---------- INVESTICE ---------- */
function vInvestice(p){
  const ti=totalInvest();
  let h=pageHero('Hodnota investic a úspor',fm(ti),`tento cyklus vloženo ${fm(investedInPeriod(p.id))}`,'var(--cyan)');
  h+=tipBan('percent',`<b>Spořák s pevným úrokem:</b> nastav <b>úrok % p.a.</b> a appka k 1. dni v měsíci sama připíše úrok po zdanění (daň ${S.tax} %).<br><b>Akcie a ETF:</b> úrok nech na 0 a jednou za čas dej <b>Přecenit</b> — zadáš hodnotu podle brokera a rozdíl se zapíše jako zhodnocení.`,'info');
  h+=`<div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:16px">${S.investments.some(i=>i.stock||i.crypto)?`<button class="btn" onclick="pxOverviewModal()">${ic('list',15)} Kurzy</button>`:''}<button class="btn" onclick="invCalcModal()">${ic('percent',15)} Kalkulačka</button><button class="btn fill" onclick="invModal()">${ic('plus',15)} Nová položka</button></div>`;

        ${inv.crypto?`<div class="mini">${(''+inv.qty).replace('.',',')} · kurz ${inv.pxAt?'sám '+agoTxt(inv.pxAt):'z CoinGecko'}</div>`:inv.stock?`<div class="mini">${(''+inv.qty).replace('.',',')} ks ${esc(inv.stock)}${inv.ccy&&inv.ccy!=='CZK'?' · '+inv.ccy:''} · kurz ${inv.pxAt?'sám '+agoTxt(inv.pxAt):'z burzy'}</div>`:inv.rate>0?`<div class="mini">${(''+inv.rate).replace('.',',')} % p.a. · úrok/měs. ≈ +${fm(mInt)} po dani</div>`:''}
        <div class="prog" style="height:6px;margin-top:5px"><i style="width:${pcw}%;background:var(--cyan)"></i></div></div>
      <div style="text-align:right"><div class="num" style="font-size:17px">${fm(inv.val||0)}</div><div class="mini">${pcw}%</div></div>
      <div style="display:flex;flex-direction:column;gap:3px">${inv.crypto||inv.stock?'':`<button class="btn sm" onclick="invAdd('${inv.id}')">${ic('plus',14)} Kč</button>`}<button class="ib" onclick="invModal('${inv.id}')">${ic('edit',15)}</button></div></div>
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px;padding-top:10px;border-top:1.5px solid var(--line)">

        <span class="mini">Zhodnocení <b class="num" style="color:${gain>0?'var(--teal)':gain<0?'var(--neg)':'var(--text3)'}">${gain>0?'+':''}${fm(gain)}${put>0?` (${gain>0?'+':''}${(''+gpc).replace('.',',')} %)`:''}</b></span>

    if(inv.pxBad)h+=`<div class="mini" style="margin-top:8px;color:var(--gold)">${ic('zap',13)} Kurz se nedaří načíst — zkontroluj symbol <b>${esc(inv.stock||'')}</b>. Hodnota níž je poslední známá, ne aktuální.</div>`;

    h+=`</div>`;});

}

/* ---------- DLUHY ---------- */
function vDluhy(p){
  let h=tipBan('landmark','Přidej si libovolný dluh — půjčku, hypotéku, cokoliv. Pojmenuj si ho, nastav <b>úrok % p.a.</b> (klidně 0) a zapisuj splátky. Vidíš, kolik zbývá doplatit a kolik tě stojí úrok měsíčně.');
  h+=pageHero('Zbývá splatit',fm(totalDebt()),`splátky tento cyklus ${fm(debtPaidInPeriod(p))}`,'var(--blue)');
  h+=`<div style="display:flex;justify-content:center;gap:8px;margin-bottom:16px;flex-wrap:wrap"><button class="btn" onclick="newGroupModal()">${ic('home',15)} Nový projekt (byt, auto…)</button><button class="btn fill" onclick="debtModal()">${ic('plus',15)} Nový dluh</button></div>`;
  if(!S.debts.length&&!Object.keys(S.debtGroups).length)h+=`<div class="card"><div class="empty">Zatím žádné dluhy. Přidej třeba „Půjčka od rodičů" (0 %) nebo „Hypotéka" — nebo si nejdřív založ projekt jako „Byt" a dluhy k němu přidávej postupně.</div></div>`;
  // dluhy se stejnou skupinou (např. Byt) se sčítají do společného souhrnu; projekt může existovat i bez dluhu
  const groups=new Map(),solo=[];
  S.debts.forEach((d,i)=>{const g=(d.group||'').trim();if(g){if(!groups.has(g))groups.set(g,[]);groups.get(g).push({d,i});}else solo.push({d,i});});
  Object.keys(S.debtGroups).forEach(g=>{if(!groups.has(g))groups.set(g,[]);});
  let gc=0;
  groups.forEach((arr,g)=>{const gcol=col(gc++);
    const principal=arr.reduce((s,x)=>s+(x.d.principal||0),0);
    const paid=arr.reduce((s,x)=>s+debtPaid(x.d),0);
    const rem=arr.reduce((s,x)=>s+debtRemaining(x.d),0);
    const monthly=arr.reduce((s,x)=>s+(x.d.monthly||0),0);
    const pc=principal>0?Math.min(100,Math.round(paid/principal*100)):0;
    let maxN=0,never=false,anyOpen=false;
    arr.forEach(x=>{const po=debtPayoff(x.d);if(!po)return;if(po.never)never=true;else if(!po.done){anyOpen=true;maxN=Math.max(maxN,po.n);}});
    const gm=groupMeta(g),contribs=gm.contrib||[],feeList=gm.fees||[],ownPaid=groupContribTotal(g),feesSum=groupFeesTotal(g),price=gm.price||0,ltv=gm.ltv||0;
    const totalPrice=price+feesSum;
    const disbursedPrincipal=arr.filter(x=>x.d.paidToPrice).reduce((s,x)=>s+(x.d.principal||0),0);
    const coveredTotal=ownPaid+disbursedPrincipal;         // reálně použito na koupi: vklady + jen "vyřízené" půjčky
    const priceGap=totalPrice>0?Math.max(0,totalPrice-coveredTotal):0;
    const pricePc=totalPrice>0?Math.min(100,Math.round(coveredTotal/totalPrice*100)):0;
    const pendingPrincipal=principal-disbursedPrincipal;   // sjednáno, ale ještě nešlo do koupě
    // LTV se počítá z čisté kupní ceny, bez poplatků — přesně jak to dělají banky
    const suggestedMortgage=(ltv>0&&price>0)?Math.round(price*ltv/100):0;
    // kolik to fakticky vyjde vč. úroků: vklady (bez úroku) + u každého dluhu jistina+odhad úroků za celou dobu
    const lifetimeTotal=ownPaid+arr.reduce((s,x)=>s+debtLifetimeCost(x.d).total,0);

        <button class="ib" title="Cena a vklady" onclick="groupModal('${encodeURIComponent(g)}')">${ic('edit',15)}</button><button class="ib" title="Smazat projekt" onclick="delGroupMeta('${encodeURIComponent(g)}')">${ic('trash',15)}</button></div></div>
      ${totalPrice>0?`<div style="margin-bottom:8px"><div class="barinfo"><span class="n">Cena ${esc(g).toLowerCase()}${feesSum>0?` <span class="mini" style="font-weight:400">(${fm(price)} + poplatky ${fm(feesSum)})</span>`:''}</span><span class="v">${fm(totalPrice)}</span></div>
        <div class="track" style="height:10px"><div class="act" style="width:${pricePc}%;background:${pricePc>=100?'var(--teal)':gcol}"></div></div>
        <div style="display:flex;justify-content:space-between;margin-top:6px"><span class="mini">Reálně vloženo do koupě: <b class="num" style="color:var(--text2)">${fm(coveredTotal)}</b> (${pricePc}%)</span>${priceGap>0?`<span class="mini">Chybí dofinancovat: <b class="num" style="color:${gcol}">${fm(priceGap)}</b></span>`:`<span class="mini" style="color:var(--teal)">${ic('check',12)} kryto</span>`}</div>
        ${pendingPrincipal>0?`<div class="mini" style="margin-top:6px">+ ${fm(pendingPrincipal)} sjednáno v dluzích, ale ještě nešlo do koupě — zaškrtni u dluhu „šlo do koupě", až se to stane</div>`:''}

        :ownPaid>0?`<div class="mini" style="margin-bottom:12px">Vlastní vklady (hotovo, mimo dluhy): <b class="num" style="color:var(--text2)">${fm(ownPaid)}</b></div>`:''}
      ${lifetimeInterest>0?`<div class="banner warn" style="margin:0 0 12px;padding:11px 14px"><span class="bi">${ic('percent',15)}</span><div>Se současnými splátkami a úroky <b>reálně zaplatíš ~${fm(lifetimeTotal)}</b>${totalPrice>0?` — o <b>${fm(lifetimeInterest)}</b> víc než cena ${esc(g).toLowerCase()}`:` (z toho úroky ~${fm(lifetimeInterest)})`}. Zatím zaplaceno <b>${fm(ownPaid+paid)}</b> (${lifetimeTotal>0?Math.round((ownPaid+paid)/lifetimeTotal*100):0} %).</div></div>`:''}
      ${contribs.length?`<div style="margin-bottom:8px"><div class="mini" style="margin-bottom:4px;font-weight:500">Vklady</div>${contribs.slice(-3).reverse().map((c,ri)=>{const oi=contribs.length-1-ri;return `<div style="display:flex;justify-content:space-between;align-items:center;font-size:12.5px;padding:2px 0"><span class="mini">${fd(c.d)} ${esc(c.n||'Vklad')}</span><span style="display:flex;align-items:center;gap:6px"><span class="num" style="color:var(--teal)">+${fm(c.a)}</span><button class="ib" onclick="delContrib('${encodeURIComponent(g)}',${oi})">${ic('x',12)}</button></span></div>`;}).join('')}</div>`:''}
      ${feeList.length?`<div style="margin-bottom:12px"><div class="mini" style="margin-bottom:4px;font-weight:500">Poplatky</div>${feeList.slice(-3).reverse().map((c,ri)=>{const oi=feeList.length-1-ri;return `<div style="display:flex;justify-content:space-between;align-items:center;font-size:12.5px;padding:2px 0"><span class="mini">${fd(c.d)} ${esc(c.n||'Poplatek')}</span><span style="display:flex;align-items:center;gap:6px"><span class="num" style="color:var(--gold)">+${fm(c.a)}</span><button class="ib" onclick="delFee('${encodeURIComponent(g)}',${oi})">${ic('x',12)}</button></span></div>`;}).join('')}</div>`:''}
      <div style="display:flex;gap:8px;margin-bottom:12px"><button class="btn sm" onclick="contribModal('${encodeURIComponent(g)}')">${ic('plus',14)} Přidat vklad</button><button class="btn sm" onclick="feeModal('${encodeURIComponent(g)}')">${ic('plus',14)} Přidat poplatek</button></div>
      ${arr.length===0?`<div class="empty" style="padding:14px 0 4px">Zatím k tomu nemáš žádný dluh.</div><button class="btn sm fill" onclick="debtModal(null,'${encodeURIComponent(g)}')">${ic('plus',14)} Přidat dluh do „${esc(g)}"</button>`:`
      <div class="grid3">
        <div style="text-align:center"><div class="mini">Zbývá splatit</div><div class="num" style="font-size:24px;color:var(--blue)">${fm(rem)}</div></div>
        <div style="text-align:center"><div class="mini">Splaceno z dluhů</div><div class="num" style="font-size:24px;color:var(--teal)">${fm(paid)}</div></div>
        <div style="text-align:center"><div class="mini">Dluhy celkem</div><div class="num" style="font-size:24px">${fm(principal)}</div></div></div>
      ${principal>0?`<div style="margin-top:14px"><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:6px"><span style="font-weight:500;color:${pc>=100?'var(--teal)':gcol}">${pc}% dluhů splaceno</span><span class="mini">${monthly>0?fm(monthly)+' / měs':''}</span></div><div class="prog"><i style="width:${pc}%;background:${pc>=100?'var(--teal)':gcol}"></i></div></div>`:''}
      ${monthly>0&&anyOpen&&!never?`<div class="mini" style="margin-top:8px">Při ${fm(monthly)}/měs máš dluhy splacené ~<b>${futureMonthStr(maxN)}</b></div>`:''}
      ${!anyOpen&&principal>0&&rem<=0?`<div class="mini" style="margin-top:8px;color:var(--teal)">${ic('check',13)} Dluhy doplaceny</div>`:''}`}</div>`;
    arr.forEach(x=>h+=debtCard(x.d,x.i,true));
  });
  solo.forEach(x=>h+=debtCard(x.d,x.i,false));
  return h;
}
function debtCard(d,i,inGroup){
  let h='';
  {const rem=debtRemaining(d),paid=debtPaid(d),pc=d.principal>0?Math.min(100,Math.round(paid/d.principal*100)):0;const mInt=d.rate>0?Math.round(rem*d.rate/100/12):0;const pcol=pc>=100?'var(--teal)':'var(--blue)';
    h+=`<div class="card" style="${inGroup?'margin-left:22px':''}">
      <div class="ch"><span style="font-size:16px;font-weight:500;display:flex;align-items:center;gap:10px"><span class="mvi" style="width:34px;height:34px;background:${col(i)}1c;color:${col(i)}">${ic(d.icon||'landmark',18)}</span>${esc(d.nm)}${d.type?` <span class="tag" style="background:var(--bg2);color:var(--text3)">${esc(d.type)}</span>`:''}${inGroup?(d.paidToPrice?`<span class="tag ok">šlo do koupě</span>`:`<span class="tag wr">ještě nečerpáno</span>`):''}</span>
        <div style="display:flex;gap:4px"><button class="btn sm fill" onclick="debtPayModal('${d.id}')">Splátka</button><button class="ib" onclick="debtModal('${d.id}')">${ic('edit',15)}</button><button class="ib" onclick="delDebt('${d.id}')">${ic('trash',15)}</button></div></div>
      <div class="grid3">
        <div style="text-align:center"><div class="mini">Zbývá</div><div class="num" style="font-size:22px;color:var(--blue)">${fm(rem)}</div></div>
        <div style="text-align:center"><div class="mini">Splaceno</div><div class="num" style="font-size:22px;color:var(--teal)">${fm(paid)}</div></div>
        <div style="text-align:center" title="Kolik tě úrok stojí za jeden měsíc z aktuálního zůstatku — i kdybys teď nic nesplácel."><div class="mini">${d.rate>0?'Úrok teď/měs.':'Celkem'}</div><div class="num" style="font-size:22px">${d.rate>0?fm(mInt):fm(d.principal||0)}</div></div></div>
      ${d.principal>0?`<div style="margin-top:14px"><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:6px"><span style="font-weight:500;color:${pcol}">${pc}% splaceno</span><span class="mini">${d.rate>0?(''+d.rate).replace('.',',')+' % p.a.':'bez úroku'} · z ${fm(d.principal)}</span></div><div class="prog"><i style="width:${pc}%;background:${pcol}"></i></div></div>`:''}`;
    if((d.paid0||0)>0)h+=`<div class="mini" style="margin-top:10px">Dříve splaceno (bez data): <b>${fm(d.paid0)}</b></div>`;
    if(d.fixDate)h+=`<div class="mini" style="margin-top:8px">${ic('percent',12)} Fixace do ${fdFull(d.fixDate)}, pak úrok ${(''+(d.rateAfter||0)).replace('.',',')} % p.a.</div>`;
    const po=debtPayoff(d),lc=debtLifetimeCost(d);
    if(d.monthly>0&&po)h+=`<div class="mini" style="margin-top:8px">${po.done?'Doplaceno':po.never?`Splátka ${fm(d.monthly)}/měs nepokryje měsíční úrok`:`Při ${fm(d.monthly)}/měs doplatíš ~<b>${po.date}</b>${po.interest>0?` · zbývající úroky ~${fm(po.interest)}`:''}`}</div>`;
    if(d.monthly>0&&!lc.unknown&&!lc.never&&lc.total>0)h+=`<div class="mini" style="margin-top:6px;font-weight:500;color:var(--text2)">${ic('percent',12)} Na tomhle dluhu od začátku do konce zaplatíš celkem ~${fm(lc.total)}${lc.interest>0?` (jistina ${fm(d.principal)} + úroky ${fm(lc.interest)})`:''}</div>`;
    else if(!(d.monthly>0)&&d.principal>0)h+=`<div class="mini" style="margin-top:6px">Zadej měsíční splátku (nebo dobu splácení v úpravě), ať spočítám, kolik na tomhle dluhu celkem zaplatíš.</div>`;
    const pays=(d.pay||[]).slice().sort((a,b)=>(b.d||'').localeCompare(a.d||'')).slice(0,5);
    if(pays.length){h+=`<div style="margin-top:14px;padding-top:12px;border-top:1.5px solid var(--line)"><div class="mini" style="margin-bottom:6px">Poslední splátky</div>`;pays.forEach(x=>{const oi=d.pay.indexOf(x);h+=`<div style="display:flex;justify-content:space-between;align-items:center;font-size:12.5px;padding:3px 0"><span>${fd(x.d)} ${esc(x.n||'')}</span><span style="display:flex;align-items:center;gap:8px"><span class="num" style="font-weight:500;color:var(--teal)">−${fm(x.a)}</span><button class="ib" onclick="delDebtPay('${d.id}',${oi})">${ic('x',13)}</button></span></div>`;});h+=`</div>`;}
    h+=`</div>`;}
  return h;
}

function rule503020(p){
  const actBase=incBase(p), planBase=incPlan(p)||actBase;

  // typ se bere u položky, a když ho nemá, dědí se z kategorie (propojená položka = úspora)
  const A={need:0,want:0,save:0},PL={need:0,want:0,save:0};
  const linked=new Set();
  p.cats.forEach(c=>{const ck=c.kind||'need';
    if(c.pl>0)PL[ck]=(PL[ck]||0)+c.pl;                            // plán zadaný za celou kategorii
    c.it.forEach(it=>{if(it.link)linked.add(it.link);
      const k=itemKind(it,c),a=itemActual(it),pl=(c.pl>0?0:(it.pl||0));
      A[k]=(A[k]||0)+a;PL[k]=(PL[k]||0)+pl;});});
  const needsA=A.need,wantsA=A.want,needsP=PL.need,wantsP=PL.want;
  // k úsporám z položek přičti to, co běží mimo výdaje (nepropojené obálky, investice, splátky)
  const savA=A.save+savedInPeriod(p.id)+investedInPeriod(p.id)+debtPaidInPeriod(p);
  const savP=PL.save
    +S.envelopes.reduce((s,e)=>s+(linked.has('env:'+e.id)?0:(e.monthly||0)),0)
    +S.debts.reduce((s,d)=>s+(linked.has('debt:'+d.id)?0:(d.monthly||0)),0);
  const hasPlan=(needsP+wantsP+savP)>0&&planBase>0;
  const rows=[
    {label:'Potřeby',target:50,a:needsA,pl:needsP,col:'var(--blue)',hint:'nájem, jídlo, doprava…',okIfBelow:true},
    {label:'Přání',target:30,a:wantsA,pl:wantsP,col:'var(--accent)',hint:'zábava, věci navíc…',okIfBelow:true},
    {label:'Úspory & splátky',target:20,a:savA,pl:savP,col:'var(--teal)',hint:'obálky, investice, dluhy',okIfBelow:false},
  ];
  let h=`<div class="card"><div class="ct" style="margin-bottom:4px">Pravidlo 50/30/20</div>
    <div class="mini" style="margin-bottom:16px">Doporučené rozdělení příjmu: 50 % potřeby · 30 % přání · 20 % úspory.${hasPlan?' Světlý pruh = plán, sytý = skutečnost.':''} Typ nastavíš u kategorie, a když chceš jinak, i u jednotlivé položky.</div>`;
  rows.forEach(r=>{
    const pcA=actBase>0?Math.round(r.a/actBase*100):0;
    const pcP=planBase>0?Math.round(r.pl/planBase*100):0;
    const judged=hasPlan?pcP:pcA;   // dokud je plán, hodnotíme plán — ať víš dopředu
    const ok=r.okIfBelow?judged<=r.target:judged>=r.target;
    const near=r.okIfBelow?judged<=r.target+7:judged>=r.target-7;
    const tag=ok?'ok':near?'wr':'bd';const tagTxt=ok?(r.okIfBelow?'v limitu':'splněno'):near?'téměř':(r.okIfBelow?'nad limit':'málo');
    h+=`<div style="margin-bottom:15px"><div class="barinfo"><span class="n">${r.label} <span class="mini" style="font-weight:400">· ${r.hint}</span></span>
      <span class="v"><span class="tag ${tag}" style="margin-right:7px">${tagTxt}</span>${hasPlan?`plán <b class="num" style="color:var(--text)">${pcP}%</b>`:`<b class="num" style="color:var(--text)">${pcA}%</b>`} / ${r.target}%</span></div>
      <div class="track" style="height:10px">
        ${hasPlan?`<div class="plan" style="width:${Math.min(100,pcP)}%;background:${r.col}"></div>`:''}
        <div class="act" style="width:${Math.min(100,pcA)}%;background:${r.col}"></div>
        <div style="position:absolute;top:-2px;bottom:-2px;left:${r.target}%;width:2px;background:var(--text);opacity:.45;border-radius:1px"></div></div>
      <div class="mini" style="margin-top:4px;display:flex;justify-content:space-between;gap:8px">
        <span>${hasPlan?`plán ${fm(r.pl)}`:''}</span><span>utraceno ${fm(r.a)} · ${pcA} %</span></div></div>`;});
  if(hasPlan){const tot=needsP+wantsP+savP,totPc=Math.round(tot/planBase*100),rest=planBase-tot;
    h+=`<div style="display:flex;justify-content:space-between;align-items:center;padding-top:12px;margin-top:4px;border-top:1.5px solid var(--line);font-size:13px">

/* ---------- vývoj jmění v čase ----------
   Jmění se nikam neukládá a ani nemusí. Dnešek je známý přesně
   (totalInvest / totalEnvelopes / debtRemaining) a minulost se z něj
   dopočítá odečtením pohybů, které přišly potom. Graf tak vždycky sedí
   s čísly nad ním, i když se historie dodatečně opraví.
   Do zůstatků patří i záznamy s adj:true (oprava zůstatku) a se src
   (zápis přes propojenou položku): do rozpočtu cyklu se schválně
   nepočítají, ale zůstatek opravdu změnily, takže do jmění patří. */
function nwAt(t){
  // Dvě ošklivá data se musí ohnout, jinak by poslední bod grafu neseděl
  // s dlaždicemi nad ním: pohyb s budoucím datem se počítá jako dnešní
  // a pohyb úplně bez data patří do počátečního zůstatku (odjakživa).
  const now=todayISO(),cl=d=>d<now?d:now;
  const aft=d=>!!d&&cl(d)>t, upto=d=>!d||cl(d)<=t;
  let inv=totalInvest(),env=totalEnvelopes();
  S.investments.forEach(v=>(v.hist||[]).forEach(x=>{if(aft(x.d))inv-=(x.a||0);}));
  S.envelopes.forEach(e=>(e.hist||[]).forEach(x=>{if(aft(x.d))env-=(x.t==='out'?-(x.a||0):(x.a||0));}));
  const debt=S.debts.reduce((s,d)=>s+Math.max(0,(d.principal||0)-(d.paid0||0)
    -(d.pay||[]).reduce((ss,x)=>ss+(upto(x.d)?(x.a||0):0),0)),0);
  return {d:t,inv,env,debt,nw:inv+env-debt};
}
// jeden bod na konec každého měsíce, poslední bod je vždycky dnešek
function nwSeries(){
  const ds=[];
  S.investments.forEach(v=>(v.hist||[]).forEach(x=>{if(x.d)ds.push(x.d);}));
  S.envelopes.forEach(e=>(e.hist||[]).forEach(x=>{if(x.d)ds.push(x.d);}));
  S.debts.forEach(d=>(d.pay||[]).forEach(x=>{if(x.d)ds.push(x.d);}));
  S.periods.forEach(p=>{if(p.from)ds.push(p.from);});
  if(!ds.length)return [];
  const today=todayISO(),start=ds.reduce((a,b)=>a<b?a:b,ds[0]);
  if(start>today)return [];
  const pts=[],c=new Date(start+'T12:00:00');c.setDate(1);
  for(let i=0;i<360;i++){
    const last=iso(new Date(c.getFullYear(),c.getMonth()+1,0));
    pts.push(nwAt(last>today?today:last));
    if(last>=today)break;
    c.setMonth(c.getMonth()+1);
  }
  if(pts.length&&pts[pts.length-1].d!==today)pts.push(nwAt(today));

const nwMon=s=>{const p=s.split('-');return +p[1]+'/'+p[0].slice(2);};

/* ---------- srovnání s minulým cyklem ----------

  const rate=inc>0?Math.round((saved+invv)/inc*100):0;
  const cmap={};ps.forEach(p=>p.cats.forEach(c=>{const a=catActual(c);if(a>0)cmap[c.nm]=(cmap[c.nm]||0)+a;}));
  ps.forEach(p=>S.envelopes.forEach(e=>(e.hist||[]).forEach(h=>{if(h.t==='out'&&h.pid===p.id&&h.cat&&h.a>0)cmap[h.cat]=(cmap[h.cat]||0)+h.a;})));
  const cats=Object.entries(cmap).map(([nm,a])=>({nm,a:Math.round(a/n)})).sort((x,y)=>y.a-x.a).map((x,i)=>({...x,i}));
  const fullExpAvg=cats.reduce((s,c)=>s+c.a,0);
  let h=`<div class="card"><div class="ct" style="margin-bottom:14px">Průměr na období · ${n} období</div>`+mrow([['Ø Příjem',fm(inc),'color:var(--teal)'],['Ø Výdaje',fm(exp),''],['Ø Zůstatek',fm(inc-exp),inc-exp>=0?'color:var(--teal)':'color:var(--neg)']])+`</div>`;
  h+=mrow([['Ø Míra úspor',rate+'%',rate>=20?'color:var(--teal)':rate>=10?'color:var(--gold)':'color:var(--neg)'],['Ø Odloženo',fm(saved),'color:var(--gold)'],['Ø Investováno',fm(invv),'color:var(--cyan)']]);
  h+=catShare(cats,fullExpAvg,'Ø Podíl kategorií');
  return h;
}

// pozor: nesmí volat go() — to by detailCat hned vynulovalo

/* ---- rychlé zadání: druhé pole nabízí položky vybrané kategorie ----
   Psát „za co" ručně znamenalo trefit se do názvu, jinak vznikla nová
   položka jako duplikát. Vybírá se tedy ze seznamu a nová položka je
   samostatná volba. U obálky zůstává volný text — obálka položky nemá. */
// Prázdno znamená prázdno: po otevření appky není vybraná ani kategorie,
// ani položka. Nic se nesmí připsat jinam, než kam se člověk dívá.
function qaCur(p){
  if(qaSel==='vyplata')return 'vyplata';
  if(qaSel.startsWith('cat:')&&p.cats.some(c=>'cat:'+c.id===qaSel))return qaSel;
  if(qaSel.startsWith('env:')&&S.envelopes.some(e=>'env:'+e.id===qaSel))return qaSel;
  if(qaSel.startsWith('inv:')&&S.investments.some(i=>'inv:'+i.id===qaSel))return qaSel;
  if(qaSel.startsWith('debt:')&&S.debts.some(d=>'debt:'+d.id===qaSel))return qaSel;
  return '';
}
// vybraná položka (jen u kategorie — obálka ani investice položky nemají)
function qaSelItem(p){
  const cur=qaCur(p);if(!cur.startsWith('cat:')||!qaItem||qaItem==='__new')return null;
  const c=p.cats.find(x=>'cat:'+x.id===cur);
  return (c&&c.it.find(it=>it.id===qaItem))||null;
}
const qaFixAmt=p=>{const it=qaSelItem(p);return it&&it.fixAmt&&it.pl>0?it.pl:0;};
/* Přesun peněz — jediné místo, kudy appka zapisuje pohyb mezi truhlicemi.
   Pravidlo je vždy stejné: ze zdroje Výplata se prostě zapíše normální
   vklad/výdaj (to je to, co appka dělala vždycky). Ze zdroje Obálka/
   Investice se navíc PŘED tím odečte z té truhlice — u obálky je odečet
   strukturálně neviditelný pro „zbývá volných" (stejně jako dosavadní
   čerpání), u investice je to opravdový záporný zápis, který se v součtu
   sám vyruší s tím, co přibude na druhé straně. Jediné místo, kde se to
   samo nevyruší, je obálka jako zdroj mimo kategorii (obálka → obálka/
   investice/dluh) — tam se druhá strana označí `src`, ať se nezapočítá
   podruhé. Ověřeno pro všechny kombinace automatizovaným testem. */
function quickAdd(){const p=P();
  const from=qaXfer?(document.getElementById('qfrom')?.value||''):'vyplata';
  const val=qaXfer?'vyplata':(document.getElementById('qcat')?.value||'');
  if(qaXfer&&!from){toast('Vyber odkud');return;}
  if(!val){toast('Vyber kam');return;}
  if(from===val){toast('Zdroj a cíl musí být různé');return;}
  const amt=Math.abs(num(document.getElementById('qamt').value));if(!amt){toast('Zadej částku');return;}
  const nmEl=document.getElementById('qname'),nm=nmEl?nmEl.value.trim():'';
  const noteEl=document.getElementById('qnote'),poznamka=noteEl?noteEl.value.trim():'';
  const date=document.getElementById('qdate').value||todayISO();
  qaSel=val;qaFrom=from;qaDate=date; // zapamatuj výběr pro další zadání
  const tp=periodForEntry(date)||p,jinam=tp.id!==p.id;
  const zNazev=presunNazev(from);
  // Aktivní účet (Přehled, nad "zbývá volných"): z výplaty odchází peníze
  // z něj (odečte se), "peníze zpět na účet" mu je připíše. Přesun mezi
  // obálkou/investicí a kategorií/jinou truhlicí se účtu nedotýká — tam
  // fyzicky žádný účet neprochází.
  const accEl=document.getElementById('qacc');
  const acc=accEl?accEl.value:(S.ui.activeAcc||'');
  let srcEntry=null;

  if(from.startsWith('env:')){
    const e=S.envelopes.find(x=>x.id===from.slice(4));if(!e)return;
    if(amt>(e.bal||0)){toast('V obálce '+e.nm+' není dost peněz');return;}
    const out={id:uid(),d:date,t:'out',a:amt,n:nm,pid:tp.id};
    if(val.startsWith('cat:')){const c=p.cats.find(x=>'cat:'+x.id===val);if(c)out.cat=c.nm;}
    e.bal=(e.bal||0)-amt;e.hist.push(out);srcEntry=out;
    if(val.startsWith('cat:')){   // obálka → kategorie: appka to odjakživa řeší jen značkou na obálce
      commit();toast(`${zNazev} → ${presunNazev(val)}: ${fm(amt)}`+(jinam?` · ${tp.nm}`:''));
      setTimeout(()=>{const a=document.getElementById('qamt');if(a)a.value='';},60);return true;
    }
  }else if(from.startsWith('inv:')){
    const inv=S.investments.find(x=>x.id===from.slice(4));if(!inv)return;
    const en={id:uid(),d:date,a:-amt,n:nm,pid:tp.id};
    inv.val=(inv.val||0)-amt;inv.hist.push(en);srcEntry=en;
  }

  if(val==='vyplata'){   // zpátky na účet, bez kategorie — jen truhlice → výplata
    if(acc&&srcEntry){srcEntry.acc=acc;accBump(acc,amt);}
    commit();toast(`${zNazev} → Účet: ${fm(amt)}`+(jinam?` · ${tp.nm}`:''));
    setTimeout(()=>{const a=document.getElementById('qamt');if(a)a.value='';},60);return true;
  }

  if(val.startsWith('cat:')){
    const cid=val.slice(4);const c=p.cats.find(x=>x.id===cid);if(!c)return;
    const selEl=document.getElementById('qitem');
    if(selEl&&!selEl.value){toast('Vyber položku');return;}
    let it=selEl&&selEl.value&&selEl.value!=='__new'?c.it.find(x=>x.id===selEl.value):null;
    if(!it){const itNm=nm||'Ostatní';it=c.it.find(x=>x.nm.toLowerCase()===itNm.toLowerCase());
      if(!it){it={id:uid(),nm:itNm,pl:0,log:[]};c.it.push(it);}}
    qaItem=it.id;
    const le={id:uid(),d:date,a:amt,n:from!=='vyplata'?('z '+zNazev+(poznamka?' · '+poznamka:'')):poznamka};
    if(from==='vyplata'&&acc){le.acc=acc;accBump(acc,-amt);}
    const r=logToDate(c,it,le);
    const lt=linkTarget(it);
    toast(`${c.nm}: ${fm(amt)}`+(lt?` → ${lt.obj.nm}`:'')+(from!=='vyplata'?` · z ${zNazev}`:'')+(r.jinam?` · POZOR: podle data ${fd(date)} to spadlo do období „${r.period.nm}", ne do otevřeného`:''),r.jinam?5000:2200);
  }else if(val.startsWith('env:')){
    const e=S.envelopes.find(x=>x.id===val.slice(4));if(!e)return;
    const en={id:uid(),d:date,t:'in',a:amt,n:nm,pid:tp.id};
    if(from.startsWith('env:'))en.src=zNazev;   // jinak se stejná koruna počítá jako odloženo podruhé
    if(from==='vyplata'&&acc){en.acc=acc;accBump(acc,-amt);}
    e.bal=(e.bal||0)+amt;e.hist.push(en);
    toast(`${zNazev} → ${e.nm}: ${fm(amt)}`+(jinam?` · ${tp.nm}`:''));
  }else if(val.startsWith('inv:')){
    const inv=S.investments.find(x=>x.id===val.slice(4));if(!inv)return;
    const en={id:uid(),d:date,a:amt,n:nm,pid:tp.id};
    if(from.startsWith('env:'))en.src=zNazev;
    if(from==='vyplata'&&acc){en.acc=acc;accBump(acc,-amt);}
    inv.val=(inv.val||0)+amt;inv.hist.push(en);
    toast(`${zNazev} → ${inv.nm}: ${fm(amt)}`+(jinam?` · ${tp.nm}`:''));
  }else if(val.startsWith('debt:')){
    const dt=S.debts.find(x=>x.id===val.slice(5));if(!dt)return;
    const en={id:uid(),d:date,a:amt,n:nm};
    if(from.startsWith('env:'))en.src=zNazev;
    if(from==='vyplata'&&acc){en.acc=acc;accBump(acc,-amt);}
    dt.pay=dt.pay||[];dt.pay.push(en);
    toast(`${zNazev} → ${dt.nm}, splátka: ${fm(amt)}`);
  }
  commit();setTimeout(()=>{const a=document.getElementById('qamt');if(a)a.value='';},60);return true;}

/* ---- Pohyby: jeden prohledatelný seznam napříč kategoriemi, obálkami,
   investicemi a dluhy. Historie zpětně se schválně NEDOTAHUJE — appka
   ukazuje jen pohyby od zapnutí (S.ui.pohybyOd), stará data zůstávají
   beze změny vidět postaru ve svých záložkách. */
// "· z Raiffka" / "· na účet Raiffka" — jen když má zápis značku `acc` (viz quickAdd/addLog/envMove/invAdd/debtPayModal)
const accSub=(accId,dirIn)=>{if(!accId)return '';const a=accById(accId);return a?(' · '+(dirIn?'na účet ':'z ')+a.nm):'';};
function allMovements(od){
  const out=[];
  S.periods.forEach(per=>per.cats.forEach(c=>c.it.forEach(it=>(it.log||[]).forEach((le,li)=>{
    if(le.d<od)return;
    const lt=linkTarget(it);
    out.push({d:le.d,a:le.a,ikona:c.icon,label:c.nm+': '+it.nm,sub:(le.n?le.n+' · ':'')+'výdaj'+(lt?' → '+lt.obj.nm:'')+accSub(le.acc,false),icon:'arrowupright',volne:true,rid:le.id||'',
      kind:'cat',pid:per.id,cid:c.id,iid:it.id,li});
  }))));
  S.envelopes.forEach(e=>(e.hist||[]).forEach((h,hidx)=>{
    if(h.d<od)return;
    const volne=h.t==='in'&&!h.src;
    out.push({d:h.d,a:h.a,ikona:e.icon,label:'Obálka: '+e.nm,sub:(h.n?h.n+' · ':'')+(h.adj?'oprava zůstatku':h.t==='in'?(h.src?'z '+h.src:'vklad'):'čerpání'+(h.cat?' · '+h.cat:''))+accSub(h.acc,h.t==='out'),icon:h.t==='in'?'arrowupright':'arrowdownleft',volne,rid:h.id||'',
      kind:'env',eid:e.id,hidx});
  }));
  S.investments.forEach(inv=>(inv.hist||[]).forEach((h,hidx)=>{
    if(h.k||h.d<od)return;
    const volne=!h.src;
    out.push({d:h.d,a:Math.abs(h.a),ikona:inv.icon,label:'Investice: '+inv.nm,sub:(h.n?h.n+' · ':'')+(h.src?'z '+h.src:h.a>0?'vklad':'výběr')+accSub(h.acc,h.a<0),icon:h.a>0?'arrowupright':'arrowdownleft',volne,rid:h.id||'',
      kind:'inv',invId:inv.id,hidx});
  }));
  S.debts.forEach(dt=>(dt.pay||[]).forEach((h,hidx)=>{
    if(h.d<od)return;
    out.push({d:h.d,a:h.a,ikona:dt.icon,label:'Dluh: '+dt.nm,sub:(h.n?h.n+' · ':'')+(h.src?'z '+h.src:'splátka')+accSub(h.acc,false),icon:'arrowupright',volne:!h.src,rid:h.id||'',
      kind:'debt',did:dt.id,hidx});
  }));
  S.accounts.forEach(a=>(a.hist||[]).forEach((h,hidx)=>{
    if(h.d<od)return;
    out.push({d:h.d,a:Math.abs(h.a),ikona:a.icon,label:'Účet: '+a.nm,sub:(h.n?h.n+' · ':'')+(h.a>=0?'vklad':'výběr'),icon:h.a>=0?'arrowupright':'arrowdownleft',volne:false,rid:h.id||'',
      kind:'acc',aid:a.id,hidx});
  }));
  /* Stejné datum (appka nemá čas, jen den) se řadí podle `id` — ten začíná
     časovým razítkem (viz uid()), takže i bez skutečného pole "čas" sedí
     pořadí na to, co bylo zapsáno/upraveno později. Dřív se řadilo podle
     pořadí procházení polí (kategorie→obálky→...), což u dvou zápisů ve
     STEJNÝ den, ale v RŮZNÝCH položkách/kategoriích, dávalo nahoru tu, co
     appka narazila dřív při procházení — ne tu, co byla zapsaná později. */
  out.sort((x,y)=>y.d.localeCompare(x.d)||y.rid.localeCompare(x.rid));
  return out;
}

      </select></div>

      <select class="inp" id="m_defacc">
        <option value="">— podle toho, co je zrovna aktivní —</option>
        ${S.accounts.map(a=>`<option value="${a.id}" ${it.defAcc===a.id?'selected':''}>${esc(a.nm)}</option>`).join('')}

      <div class="mini" style="margin-top:5px">Hodí se na pravidelnou platbu, co vždycky jde ze stejného účtu (internet z mBank, nájem z Raiffky…), bez ohledu na to, jaký účet je zrovna vybraný na Přehledu.</div></div>`:''}
    <div class="macts"><button class="btn gho" onclick="closeModal()">Zrušit</button><button class="btn fill" onclick="saveItemCfg()">Uložit</button></div>
    <div style="margin-top:14px;padding-top:14px;border-top:1.5px solid var(--line)">

  setTimeout(()=>document.getElementById('m_nm')?.focus(),50);
}
function saveItemCfg(){
  const c=P().cats.find(x=>x.id===mctx.cid),it=c&&c.it.find(x=>x.id===mctx.iid);if(!it)return;
  const nm=document.getElementById('m_nm').value.trim();
  if(!nm){toast('Název nesmí být prázdný');return;}
  const link=document.getElementById('m_link').value,kind=document.getElementById('m_kind').value;
  const linkPred=it.link||'';
  it.nm=nm;it.pl=num(document.getElementById('m_pl').value);
  if(document.getElementById('m_fix').checked)it.fixAmt=true;else delete it.fixAmt;
  const defAcc=document.getElementById('m_defacc')?.value;if(defAcc)it.defAcc=defAcc;else delete it.defAcc;
  it.link=link||'';
  if(kind)it.kind=kind;else delete it.kind;
  /* Změna propojení musí přerovnat i to, co je zapsané. Bez tohohle
     zůstaly staré splátky viset u původního dluhu a k novému se
     nepřidaly — dluh pak ukazoval špatný zůstatek napořád. */
  let presunuto=0;
  if((it.link||'')!==linkPred){
    (it.log||[]).forEach(le=>{
      removeLinked(le.id);
      if(it.link)pushLinked(it,le,(periodForDate(le.d)||{}).id||S.curId);
      presunuto++;});
  }
  openItem=mctx.iid;closeModal();
  toast(presunuto?`Uloženo · ${presunuto} ${presunuto===1?'zápis přesunut':presunuto<5?'zápisy přesunuty':'zápisů přesunuto'}`:'Uloženo');
  commit();
}
function setCatPlan(cid,v){const c=P().cats.find(x=>x.id===cid);if(c){c.pl=num(v);commit();}}

/* modal infra */
function openModal(html,cls){document.getElementById('ov')?.remove();const ov=document.createElement('div');ov.className='ov'+(cls?' ov-'+cls:'');ov.id='ov';ov.innerHTML=`<div class="modal ${cls||''}">${html}</div>`;ov.onclick=e=>{if(e.target===ov)closeModal();};document.body.appendChild(ov);}
function closeModal(){document.getElementById('ov')?.remove();}
function iconPicker(list,cur){return `<div class="iconpick" id="m_ic">${list.map(n=>`<button class="${cur===n?'on':''}" data-ic="${n}" onclick="mctx.icon='${n}';document.querySelectorAll('#m_ic button').forEach(b=>b.classList.toggle('on',b.dataset.ic==='${n}'))">${ic(n,20)}</button>`).join('')}</div>`;}

function catModal(id){const c=id?P().cats.find(x=>x.id===id):null;mctx={id,icon:c?c.icon:'cart',kind:c?(c.kind||'need'):'need'};

function delCat(id){const p=P(),c=p.cats.find(x=>x.id===id);if(!c)return;

  ids.forEach(removeLinked);
  p.cats=p.cats.filter(x=>x.id!==id);detailCat=null;closeModal();commit();}
function moveCat(id,dir){const p=P();const i=p.cats.findIndex(x=>x.id===id);const j=i+dir;if(i<0||j<0||j>=p.cats.length)return;const c=p.cats.splice(i,1)[0];p.cats.splice(j,0,c);commit();}

function saveEnv(){const nm=document.getElementById('m_nm').value.trim();if(!nm){toast('Zadej název');return;}const mo=num(document.getElementById('m_mo').value),tg=num(document.getElementById('m_tg').value),due=document.getElementById('m_due').value,bal=num(document.getElementById('m_bal').value);
  if(mctx.id){const e=S.envelopes.find(x=>x.id===mctx.id);e.nm=nm;e.icon=mctx.icon;e.monthly=mo;e.target=tg;e.due=due;
    const diff=bal-(e.bal||0);if(diff){e.bal=bal;e.hist.push({id:uid(),d:todayISO(),t:diff>0?'in':'out',a:Math.abs(diff),n:'Oprava zůstatku',pid:S.curId,adj:true});}}
  else{const e={id:uid(),nm,icon:mctx.icon,bal:0,monthly:mo,target:tg,due,hist:[]};if(bal){e.bal=bal;e.hist.push({id:uid(),d:todayISO(),t:'in',a:bal,n:'Počáteční',pid:S.curId,adj:true});}S.envelopes.push(e);}closeModal();commit();}
function delEnv(id){const e=S.envelopes.find(x=>x.id===id);if(e.bal>0&&!confirm(`V obálce je ${fm(e.bal)}. Opravdu smazat?`))return;if(e.bal<=0&&!confirm('Smazat obálku?'))return;S.envelopes=S.envelopes.filter(x=>x.id!==id);commit();}
function envMove(id,dir){const e=S.envelopes.find(x=>x.id===id);mctx={id,dir};openModal(`<h3>${dir==='in'?'Vložit do':'Čerpat z'}: ${esc(e.nm)}</h3><div class="md">Zůstatek: <b>${fm(e.bal||0)}</b>${dir==='in'?' · vklad se započítá jako „odloženo" tento cyklus.':' · ubyde z obálky (do výplaty se už nepočítá).'}</div>
    <div class="fg"><span class="fl">Částka</span><input class="inp num" id="m_a" type="number" placeholder="0" onkeydown="if(event.key==='Enter')doEnvMove()"></div>
    <div class="fg"><span class="fl">Poznámka</span><input class="inp" id="m_n" placeholder="${dir==='in'?'nepovinné':'např. Letenky'}" onkeydown="if(event.key==='Enter')doEnvMove()"></div>
    ${dir==='out'?`<div class="fg"><span class="fl">Zařadit do kategorie (nepovinné, pro statistiky)</span><select class="inp" id="m_cat"><option value="">— nezařazovat —</option>${P().cats.map(c=>`<option value="${esc(c.nm)}">${esc(c.nm)}</option>`).join('')}</select></div>`:''}
    <div class="macts"><button class="btn gho" onclick="closeModal()">Zrušit</button><button class="btn fill" onclick="doEnvMove()">${dir==='in'?'Vložit':'Čerpat'}</button></div>`);
  setTimeout(()=>document.getElementById('m_a')?.focus(),50);}
function doEnvMove(){const e=S.envelopes.find(x=>x.id===mctx.id);const a=Math.abs(num(document.getElementById('m_a').value));if(!a){toast('Zadej částku');return;}const n=document.getElementById('m_n').value.trim();
  if(mctx.dir==='out'&&a>(e.bal||0)){toast('V obálce není dost peněz');return;}
  const entry={id:uid(),d:todayISO(),t:mctx.dir,a,n,pid:S.curId};
  if(mctx.dir==='out'){const cat=document.getElementById('m_cat')?.value;if(cat)entry.cat=cat;}
  const acc=mctx.dir==='in'?S.ui.activeAcc:'';if(acc){entry.acc=acc;accBump(acc,-a);}   // čerpání se účtu nedotýká — už bylo odečteno při vkladu
  e.bal=(e.bal||0)+(mctx.dir==='in'?a:-a);e.hist.push(entry);closeModal();toast(`${mctx.dir==='in'?'+':'−'}${fm(a)} · ${e.nm}`);commit();}

function delEnvHist(id,idx){const e=S.envelopes.find(x=>x.id===id);if(!e||!e.hist||!e.hist[idx])return;
  const x=e.hist[idx];if(!confirm('Smazat tenhle záznam z historie obálky?'))return;
  if(x.acc)accBump(x.acc,x.a);
  e.bal=(e.bal||0)-(x.t==='in'?x.a:-x.a);e.hist.splice(idx,1);commit();}
// úprava záznamu z obálky (i z Pohybů) — směr (vklad/čerpání) se neopravuje, jen částka/datum/poznámka
function envHistModal(eid,idx){
