  mctx={eid,idx};
  openModal(`<h3>Upravit záznam</h3><div class="md">${esc(e.nm)} · ${h.adj?'oprava zůstatku':h.t==='in'?'vklad':'čerpání'}${h.cat?' · '+esc(h.cat):''}</div>

    <div style="margin-top:14px;padding-top:14px;border-top:1.5px solid var(--line)"><button class="btn dgr sm" onclick="delEnvHist('${eid}',${idx})">${ic('trash',14)} Smazat záznam</button></div>`);
  setTimeout(()=>{const el=document.getElementById('m_a');el?.focus();el?.select();},50);
}
function saveEnvHist(){
  const e=S.envelopes.find(x=>x.id===mctx.eid),h=e&&e.hist[mctx.idx];if(!h)return;
  const a=Math.abs(num(document.getElementById('m_a').value));if(!a){toast('Zadej částku');return;}
  const d=document.getElementById('m_d').value||h.d,n=document.getElementById('m_n').value.trim();
  e.bal=(e.bal||0)-(h.t==='in'?h.a:-h.a)+(h.t==='in'?a:-a);
  if(h.acc){accBump(h.acc,h.a);accBump(h.acc,-a);}
  h.a=a;h.d=d;h.n=n;

/* ---------- ÚČTY ----------
   Kde peníze fyzicky leží (Raiffka, mBank, spořák...) — na rozdíl od
   obálek se přesun mezi účty NIKDY nepočítá do „zbývá volných" (pořád
   je to tvoje volná peníze, jen mění místo). Vlastní `hist[]` mají jen
   pro přímé akce v týhle záložce (přesun mezi účty, ruční vklad/výběr,
   oprava zůstatku) — běžné výdaje/odložení/splátky, co si vezmou peníze
   z aktivního účtu (S.ui.activeAcc), se sem NEkopírují jako druhý
   záznam. Mají jen značku `acc` u sebe (viz quickAdd/addLog/envMove/
   invAdd/debtPayModal), aby šlo při úpravě/smazání zůstatek účtu
   správně vrátit zpátky. */
// pruh nad Přehledem — klik vybere/zruší aktivní účet, ze kterého se pak
// běžné zápisy samy odečítají (viz quickAdd/addLog/envMove/invAdd/debtPayModal)
// Přepínač "Účty dohromady" / jednotlivé účty — stejný vzhled a ovládání
// jako přepínač období nahoře (šipky doleva/doprava). Pozice 0 = dohromady
// (S.ui.activeAcc=''), pak jednotlivé účty v pořadí S.accounts.
function accChips(){
  if(!S.accounts.length)return '';
  const act=S.ui.activeAcc;
  let h=`<div class="accrail">
    <button class="acccard ${act?'':'on'}" onclick="setActiveAcc('')">
      ${ic('coins',17)}<div class="an">Vše dohromady</div><div class="av">${fm(totalAccounts())}</div></button>`;
  S.accounts.forEach(a=>{h+=`<button class="acccard ${act===a.id?'on':''}" onclick="setActiveAcc('${a.id}')">
      ${ic(a.icon,17)}<div class="an">${esc(a.nm)}</div><div class="av">${fm(a.bal||0)}</div></button>`;});
  h+=`<button class="acccard" onclick="go('ucty')" style="flex:0 0 58px;display:grid;place-items:center;color:var(--text3)">${ic('plus',20)}</button>`;
  return h+`</div>`;
}
function setActiveAcc(id){S.ui.activeAcc=id;commit();}
/* Řada akcí pod hlavním číslem. Zápis je zvýrazněný, protože je to devět
   z deseti důvodů, proč appku vůbec otvíráš. */
function actionRow(){
  return `<div class="acts">
    <button class="prim" onclick="zapisOpen(false)"><span class="ab">${ic('plus',23)}</span><span class="al">Zápis</span></button>
    <button onclick="zapisOpen(true)"><span class="ab">${ic('repeat',21)}</span><span class="al">Přesun</span></button>
    <button onclick="go('obalky')"><span class="ab">${ic('envelope',21)}</span><span class="al">Obálky</span></button>
    <button onclick="go('ucty')"><span class="ab">${ic('wallet',21)}</span><span class="al">Účty</span></button>
  </div>`;

async function invStockPreview(refetch){
  const symEl=document.getElementById('m_sym'),qtyEl=document.getElementById('m_sqty'),el=document.getElementById('m_spx');
  if(!symEl||!el)return;
  const sym=(symEl.value||'').trim().toUpperCase();symEl.value=sym;
  const qty=num(qtyEl.value);
  if(!sym){el.textContent='Zadej symbol a počet kusů.';_stockPx=null;return;}
  if(!syncOn()){el.textContent='Bez zapnuté synchronizace kurz nestáhnu.';_stockPx=null;return;}
  if(!refetch&&_stockPx!=null){el.innerHTML=stockPxHtml(_stockPx,qty);return;}
  // starou cenu zahoď HNED — jinak by ji Vytvořit stihlo spárovat s novým
  // symbolem dřív, než dorazí odpověď, a uložilo cizí hodnotu
  _stockPx=null;_stockCcy='';
  el.textContent='Načítám kurz…';
  const porad=()=>(symEl.value||'').trim().toUpperCase()===sym;   // nepřepisuj nález k jinému symbolu
  try{const q=await stockPriceCzk(sym);_stockPx=q;_stockCcy=q.ccy;
    el.innerHTML=stockPxHtml(q,qty);
  }catch(e){
    _stockPx=null;
    if(!/nenalezen/.test(e.message||'')){el.textContent='Nepovedlo se: '+(e.message||'zkus to znovu');return;}
    // 1) překlad značení brokera — nejčastější případ, tak ho zkus první
    for(const alt of mapSymbol(sym)){
      if(!porad())return;
      el.textContent=`Symbol ${sym} burza nezná, zkouším ${alt}…`;
      try{const q=await stockPriceCzk(alt);
        if(!porad())return;
        symEl.value=alt;_stockPx=q;_stockCcy=q.ccy;
        el.innerHTML=stockPxHtml(q,qty)+`<br><span style="color:var(--teal)">${ic('check',12)} Broker píše <b>${esc(sym)}</b>, burza to zná jako <b>${esc(alt)}</b> — přepsal jsem to za tebe.</span>`;
        return;
      }catch(e2){}
    }
    // 2) hledej podle názvu i podle podobných burz zároveň — ať to netrvá dvakrát
    if(!porad())return;
    el.textContent=`Symbol ${sym} burza nezná, hledám…`;
    const nazev=(document.getElementById('m_nm')?.value||'').trim();
    const [tipy,hits]=await Promise.all([suggestSymbols(sym),findSymbols(nazev||sym.split('.')[0])]);
    if(!porad())return;
    const radky=hits.map(hitHtml).concat(tipy.filter(t=>!hits.some(h=>h.sym===t)).map(t=>`<a onclick="useSym('${esc(t)}')"><b>${esc(t)}</b></a>`));
    el.innerHTML=radky.length
      ? `Symbol <b>${esc(sym)}</b> burza nezná. Nehledáš některý z těchhle?<div style="margin-top:6px;line-height:1.9">${radky.slice(0,6).join('<br>')}</div>`
      : `Symbol <b>${esc(sym)}</b> burza nezná a nic podobného jsem nenašel. Zkus do pole Název napsat jméno firmy nebo fondu — hledám i podle něj.`;
  }}

function saveInv(){const nm=document.getElementById('m_nm').value.trim();if(!nm){toast('Zadej název');return;}

   Platí pro krypto i akcie — obojí se přeceňuje trhem, ne tvým vkladem. */
function applyMarketValue(inv,val){
  const diff=val-(inv.val||0);inv.pxAt=Date.now();
  if(!diff)return 0;
  inv.val=val;inv.hist=inv.hist||[];
  const today=todayISO(),e=inv.hist.find(x=>x.d===today&&x.k==='gain'&&x.auto);
  if(e){e.a=(e.a||0)+diff;if(!e.a)inv.hist=inv.hist.filter(x=>x!==e);}
  else inv.hist.push({id:uid(),d:today,a:diff,n:'Kurz',k:'gain',auto:true});
  return diff;
}

async function invRefreshPrice(id){const inv=S.investments.find(x=>x.id===id);

    else{const q=await stockPriceCzk(inv.stock);inv.ccy=q.ccy;delete inv.pxBad;
      inv.px=q.px;inv.fx=q.px?q.czk/q.px:1;   // ať jde v přehledu rozebrat, odkud se číslo vzalo
      const diff=applyMarketValue(inv,Math.round(q.czk*(inv.qty||0)));
      toast(`${inv.nm}: ${fmCcy(q.px,q.ccy)} · ${diff>=0?'+':''}${fm(diff)}`);}

/* Automatické stažení kurzů — jeden dotaz na všechny mince a jeden na
   všechny papíry, ne dotaz na položku. Bez připojení (nebo bez klíče
   k akciím) se prostě nic nestane a appka jede dál offline. */
let lastPxFetch=0;
async function autoPriceRefresh(force){
  const coins=S.investments.filter(i=>i.crypto&&i.qty>0);
  const stocks=S.investments.filter(i=>i.stock&&i.qty>0);
  if(!coins.length&&!stocks.length)return;
  if(!force&&Date.now()-lastPxFetch<10*60*1000)return;   // víc než jednou za 10 min nemá smysl
  lastPxFetch=Date.now();
  let zmena=false,dotek=false;
  /* Mezi zahájením a odpovědí může doběhnout synchronizace a nahradit celé
     S novějším stavem z cloudu. Držet si reference na staré objekty by
     znamenalo zapsat kurz do něčeho, co už nikde není — proto se investice
     po každém čekání dohledá znovu podle id. */
  const zivy=id=>S.investments.find(x=>x.id===id)||null;
  if(coins.length)try{
    const ids=[...new Set(coins.map(i=>i.crypto))].join(',');
    const r=await fetch(`https://api.coingecko.com/api/v3/simple/price?ids=${encodeURIComponent(ids)}&vs_currencies=czk`);
    if(r.ok){const j=await r.json();
      coins.forEach(o=>{const i=zivy(o.id);if(!i||!i.crypto||!(i.qty>0))return;
        const px=j[i.crypto]&&j[i.crypto].czk;
        if(px){dotek=true;i.px=px;i.fx=1;if(applyMarketValue(i,Math.round(px*i.qty)))zmena=true;}});}
  }catch(e){}
  if(stocks.length&&syncOn())try{
    const q=await fetchStockQuotes([...new Set(stocks.map(i=>i.stock))]);
    const fx={};
    for(const c of [...new Set(Object.values(q).map(x=>x.ccy))]){
      try{fx[c]=await fetchFx(c);}catch(e){}}
    stocks.forEach(o=>{const i=zivy(o.id);if(!i||!i.stock||!(i.qty>0))return;
      const x=q[i.stock],f=x&&fx[x.ccy];
      if(x&&f){i.ccy=x.ccy;delete i.pxBad;dotek=true;i.px=x.px;i.fx=f;
        if(applyMarketValue(i,Math.round(x.px*f*i.qty)))zmena=true;}
      // symbol, který zdroj nezná (překlep, zrušený papír), se nesmí tvářit
      // jako aktuální — jinak karta ukazuje starou hodnotu jako čerstvou
      else if(i.pxBad!==true){i.pxBad=true;zmena=true;}});
  }catch(e){}
  /* Překreslovat, když se nic nezměnilo, je nejen zbytečné — smazalo by to
     rozepsané rychlé zadání pokaždé, když se člověk vrátí do okna. Čas
     posledního kurzu se ale uložit musí, jinak po reloadu tvrdí něco jiného. */
  if(zmena)commit();
  else if(dotek)persist();
}
/* přecenění: hodnotu určuje trh, rozdíl je zhodnocení (ne tvůj vklad) */
/* ---------- investiční kalkulačka ----------
   Čistě „co kdyby" — nesahá na data, nic neukládá. Úrok se připisuje
   měsíčně a vklad chodí na konci měsíce, stejně jako to appka dělá
   u spořáků. Daň se strhává průběžně z úroku (ne až z výnosu na konci),
   protože tak to funguje i v creditInterest(). */
const invCalcAvg=()=>{const ps=S.periods.filter(p=>investedInPeriod(p.id)>0);
  return ps.length?Math.round(ps.reduce((s,p)=>s+investedInPeriod(p.id),0)/ps.length/100)*100:0;};
function invCalc(p0,pm,yr,rate,taxOn){
  const r=rate/100*(1-(taxOn?(S.tax||0)/100:0))/12,n=Math.max(1,Math.round(yr*12));
  const pts=[{m:0,val:p0,put:p0}];let v=p0;
  for(let m=1;m<=n;m++){v=v*(1+r)+pm;pts.push({m,val:v,put:p0+pm*m});}
  const put=p0+pm*n;return {pts,val:v,put,gain:v-put,r,n};
}
function invCalcModal(){
  openModal(`<h3>Investiční kalkulačka</h3><div class="md">Co z peněz bude, když je necháš pracovat. Nic se neukládá — je to jen počítadlo.</div>
    <div class="fr"><div class="fg"><span class="fl">Mám teď</span><input class="inp num" id="c_p0" type="number" value="${totalInvest()}" oninput="invCalcRun()"></div>
      <div class="fg"><span class="fl">Měsíčně přidám</span><input class="inp num" id="c_pm" type="number" value="${invCalcAvg()}" oninput="invCalcRun()"></div></div>
    <div class="fr"><div class="fg"><span class="fl">Na kolik let</span><input class="inp num" id="c_yr" type="number" value="10" min="1" max="60" oninput="invCalcRun()"></div>
      <div class="fg"><span class="fl">Výnos % ročně</span><input class="inp num" id="c_rate" type="number" value="7" step="0.5" oninput="invCalcRun()"></div></div>
    <label class="mini" style="display:flex;align-items:center;gap:8px;margin-top:13px;cursor:pointer"><input type="checkbox" id="c_tax" checked onchange="invCalcRun()" style="width:auto"> Strhávat daň z výnosu (${S.tax||0} %)</label>
    <div id="c_out" style="margin-top:16px"></div>
    <div class="macts"><button class="btn fill" onclick="closeModal()">Zavřít</button></div>`);
  invCalcRun();
}
function invCalcRun(){
  const out=document.getElementById('c_out');if(!out)return;
  const p0=num(document.getElementById('c_p0').value),pm=num(document.getElementById('c_pm').value);
  const yr=Math.max(1,Math.min(60,num(document.getElementById('c_yr').value)||1));
  const rate=num(document.getElementById('c_rate').value),taxOn=document.getElementById('c_tax').checked;
  const c=invCalc(p0,pm,yr,rate,taxOn);
  const yearly=c.pts.filter(x=>x.m%12===0||x.m===c.n);
  const W=560,H=120,PL=2,PR=2,PT=8,PB=2,mx=Math.max(c.val,c.put,1);
  const X=i=>PL+i*(W-PL-PR)/Math.max(1,yearly.length-1),Y=v=>PT+(1-v/mx)*(H-PT-PB);
  const p=(f)=>yearly.map((x,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(f(x)).toFixed(1)).join(' ');
  const valP=p(x=>x.val),putP=p(x=>x.put);
  out.innerHTML=`<div style="text-align:center;padding:14px 0;background:var(--cyan-bg);border-radius:var(--rs)">
      <div class="mini">Za ${yr} ${yr===1?'rok':yr<5?'roky':'let'} budeš mít</div>
      <div class="num" style="font-size:26px;color:var(--cyan)">${fm(c.val)}</div></div>
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block;margin-top:12px">
      <path d="${valP} L ${X(yearly.length-1).toFixed(1)} ${H-PB} L ${X(0).toFixed(1)} ${H-PB} Z" fill="var(--cyan)" opacity=".12"/>
      <path d="${putP} L ${X(yearly.length-1).toFixed(1)} ${H-PB} L ${X(0).toFixed(1)} ${H-PB} Z" fill="var(--text3)" opacity=".12"/>
      <path d="${putP}" fill="none" stroke="var(--text3)" stroke-width="1.5" stroke-dasharray="4 3"/>
      <path d="${valP}" fill="none" stroke="var(--cyan)" stroke-width="2.5" stroke-linejoin="round"/></svg>
    <div style="display:flex;gap:10px;margin-top:12px">
      <div class="tile" style="flex:1"><div class="tl">Vložil jsi</div><div class="tv" style="font-size:15px">${fm(c.put)}</div></div>
      <div class="tile" style="flex:1"><div class="tl">Vydělaly peníze</div><div class="tv" style="font-size:15px;color:${c.gain>=0?'var(--teal)':'var(--neg)'}">${c.gain>=0?'+':'−'}${fm(Math.abs(c.gain))}</div></div></div>
    <div class="mini" style="margin-top:12px">Plná čára je hodnota, čárkovaná to, co jsi tam sám dal — mezera mezi nimi je výnos.${taxOn?` Počítá se s čistým výnosem po dani, tedy ${(''+Math.round(rate*(1-(S.tax||0)/100)*100)/100).replace('.',',')} % ročně.`:' Bez daně — reálně si stát část výnosu vezme.'} Je to odhad při stálém výnosu; trh takhle hladký nikdy není.</div>`;
}

    <label class="mini" style="display:flex;align-items:center;gap:6px;cursor:pointer;margin-top:13px"><input type="checkbox" id="m_ptp" ${d&&d.paidToPrice?'checked':''} style="width:auto"> Peníze z téhle půjčky už reálně šly do koupě (do ceny skupiny)</label>
    <p class="mini" style="margin-top:2px">Dokud nezaškrtneš, dluh existuje, ale do „chybí dofinancovat" u skupiny se nepočítá — přesně pro sjednané, ale ještě nečerpané půjčky nebo budoucí hypotéku.</p>

  const upd=()=>{
    const pr=num(document.getElementById('m_pr').value),rate=num(document.getElementById('m_rate').value),dm=num(document.getElementById('m_dm').value);

    }else sugEl.innerHTML='';
    // opačný směr: znám dobu splácení, spočítej mi splátku. U hypotéky bez zadané doby zkusíme rovnou nabídnout obvyklých 30 let.
    const termIn=num(document.getElementById('m_term').value);
    const looksLikeMortgage=mctx.icon==='home'||/hypo/i.test(document.getElementById('m_ty').value)||/hypo/i.test(document.getElementById('m_nm').value);
    const term=termIn>0?termIn:(looksLikeMortgage&&dm<=0?30:0);
    const termEl=document.getElementById('m_termsug');
    if(term>0&&pr>0){const sugPay=annuityPayment(pr,rate,term*12);
      termEl.innerHTML=`${termIn>0?'Při':'Při obvyklých'} ${term} letech${rate>0?` a ${(''+rate).replace('.',',')} % p.a.`:''} by splátka byla ~<b class="num">${fm(sugPay)}</b>/měs.${termIn>0?'':' <span class="mini">(nevyplnil jsi dobu, tak zkouším typický odhad — uprav si ji výše)</span>'} <a onclick="document.getElementById('m_dm').value=${sugPay};document.getElementById('m_dm').dispatchEvent(new Event('input'))">Použít</a>`;
    }else termEl.innerHTML='';
    // živý náhled celkových nákladů
    const prev=loanPreview(pr,rate,dm,fix,ratea===''?null:num(ratea));
    const pv=document.getElementById('m_preview');
    if(!prev)pv.textContent='';
    else if(prev.unknown)pv.textContent=pr>0?'Zadej měsíční splátku, ať spočítám celkové náklady.':'';
    else if(prev.never)pv.innerHTML=`<span style="color:var(--neg)">Tahle splátka nepokryje ani úrok — dluh by nikdy nesplatil.</span>`;
    else pv.innerHTML=`Při těchhle číslech <b>zaplatíš celkem ~${fm(prev.total)}</b>${prev.interest>0?` (z toho úroky ~${fm(prev.interest)})`:''} · doplatíš ~<b>${prev.date}</b>`;
  };
  ['m_pr','m_rate','m_dm','m_gr','m_fix','m_ratea','m_term','m_nm','m_ty'].forEach(id=>document.getElementById(id).oninput=upd);
  document.getElementById('m_ic').addEventListener('click',upd); upd();}

function exportCSV(){const rows=[['Období','Kategorie','Položka','Datum','Poznámka','Částka']];
  S.periods.forEach(p=>p.cats.forEach(c=>c.it.forEach(it=>(it.log||[]).forEach(l=>rows.push([p.nm,c.nm,it.nm,l.d||'',l.n||'',l.a])))));
  S.envelopes.forEach(e=>(e.hist||[]).forEach(x=>{const p=S.periods.find(q=>q.id===x.pid);rows.push([p?p.nm:'','Obálka: '+e.nm,x.t==='in'?'vklad':'čerpání',x.d||'',x.n||'',x.t==='in'?x.a:-x.a]);}));
  S.debts.forEach(d=>(d.pay||[]).forEach(x=>{rows.push(['','Dluh: '+d.nm,'splátka',x.d||'',x.n||'',x.a]);}));
  // vklad vs. zhodnocení se rozlišuje, ať se v Excelu nesčítá dohromady
  S.investments.forEach(v=>(v.hist||[]).forEach(x=>{const p=S.periods.find(q=>q.id===x.pid);
    rows.push([p?p.nm:'','Investice: '+v.nm,x.k==='gain'?'zhodnocení':'vklad',x.d||'',x.n||'',x.a]);}));
  const csv='﻿'+rows.map(r=>r.map(v=>'"'+(''+v).replace(/"/g,'""')+'"').join(';')).join('\r\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='rozpocet-'+todayISO()+'.csv';a.click();URL.revokeObjectURL(url);toast('CSV pro Excel staženo');}
function importFile(ev){const f=ev.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.periods||!Array.isArray(d.periods)){toast('Neplatný soubor');return;}if(confirm('Nahradit aktuální data daty ze zálohy?')){S=migrate(d);applyTheme();saveLS();autosaveFile();tab='prehled';detailCat=null;toast('Obnoveno');R();}}catch(e){toast('Nepodařilo se načíst');}ev.target.value='';};r.readAsText(f);}
function resetAll(){if(confirm('Smazat VŠECHNA data a začít od nuly?')&&confirm('Fakt? Jde vrátit jen ze zálohy.')){S=defState();applyTheme();saveLS();autosaveFile();tab='prehled';detailCat=null;R();}}

document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});

/* ---------- boot ---------- */
(async function boot(){
  const ls=loadLS();if(ls)S=ls;
  loadSync();
  applyTheme();creditInterest();R();
  await tryReconnectFile();
  applyTheme();creditInterest();R();
  if(syncOn()){
    await syncNow(true);
    // po návratu k appce si ověř, jestli mezitím nepřišla novější data
    window.addEventListener('focus',()=>{if(syncOn()&&syncState!=='syncing')syncNow(true);});
  }
  // kurz krypta si appka stáhne sama — až po synchronizaci, ať nepřepisuje
  // hodnotu, kterou za chvíli přetáhne novější stav z cloudu
  autoPriceRefresh(true);
  window.addEventListener('focus',()=>autoPriceRefresh());
})();
</script>
